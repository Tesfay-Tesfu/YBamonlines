# Render Blueprint for AMtutorTools
# In Render: New + -> Blueprint -> pick this repository. Render reads this file,
# creates the web service and the Postgres database, and wires them together.

services:
  - type: web
    name: amtutortools
    runtime: node
    region: virginia            # closest to Maryland; cannot be changed later
    plan: 0.5c-512mb            # Starter: always on. ("free" sleeps after 15 min idle.)
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: amtutortools-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL              # e.g. https://amtutortools.onrender.com (used in emails)
        sync: false
      - key: ADMIN_EMAIL          # first admin account, created on first start
        sync: false
      - key: ADMIN_PASSWORD       # change it after first login
        sync: false
      - key: RESEND_API_KEY       # optional: email via resend.com (or set BREVO_API_KEY instead)
        sync: false
      - key: MAIL_FROM            # optional, e.g. "AMtutorTools <no-reply@yourdomain.com>"
        sync: false
      - key: CONTACT_WHATSAPP     # optional: your WhatsApp number with country code, e.g. 12405550123 (shows "Chat with us" after the form)
        sync: false
      - key: INTEREST_OFFER       # optional: a short offer shown on the form, e.g. "First lesson free"
        sync: false
      - key: CONTACT_DEFAULT_COUNTRY  # country code added to numbers typed without one (default 1 = US/Canada)
        value: "1"
      - key: MESSAGE_STORAGE_MB   # space for message attachments, stored in the database (default 500)
        value: "500"

databases:
  - name: amtutortools-db
    region: virginia
    # 0.1c-256mb is Render's smallest paid Postgres plan.
    # "free" also works for testing, but free databases expire 30 days after creation,
    # so do not keep real student records on it.
    plan: 0.1c-256mb
    databaseName: amtutortools
    user: amtutor
