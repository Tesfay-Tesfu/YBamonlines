<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="amt-banner" content="off">
<meta name="theme-color" content="#062a30">
<title>Writing Studio</title>
<style>
  /* ---------- themes: student = dark cyan + dark gold, tutor = dark blue + black ---------- */
  :root, .t-student {
    --bg: #04161a; --page: radial-gradient(1200px 700px at 20% -10%, #0c4a54 0%, #04161a 55%, #020c0e 100%);
    --surface: #0a3138; --surface2: #0e3f48; --surface3: #13505a; --line: rgba(160, 225, 230, .14);
    --text: #e8f6f6; --muted: #92bfc3; --faint: #5f9095;
    --accent: #d4a338; --accent2: #f0c35a; --accent-ink: #231802; --accent-soft: rgba(212, 163, 56, .16);
    --cyan: #31b7c4; --good: #4fd1a5; --bad: #ff8a7a; --warn: #f0c35a;
    --paper: #0b353d; --paper-ink: #f3f8f2; --caret: #f0c35a; --hl: rgba(240, 195, 90, .28); --hl-line: #f0c35a;
    --bezel: #0d0f10; --shadow: 0 30px 80px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .04);
  }
  .t-tutor {
    --bg: #03050a; --page: radial-gradient(1200px 700px at 80% -10%, #10264d 0%, #04070f 55%, #000 100%);
    --surface: #0b1424; --surface2: #101d34; --surface3: #172a4a; --line: rgba(150, 180, 230, .14);
    --text: #e6edf9; --muted: #95a8c9; --faint: #5d6f8f;
    --accent: #3b82f6; --accent2: #6ea8ff; --accent-ink: #fff; --accent-soft: rgba(59, 130, 246, .18);
    --cyan: #6ea8ff; --good: #4ade80; --bad: #ff7b7b; --warn: #fbbf24;
    --paper: #0a1322; --paper-ink: #edf2fb; --caret: #fbbf24; --hl: rgba(251, 191, 36, .25); --hl-line: #fbbf24;
    --bezel: #000; --shadow: 0 30px 80px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--page); background-color: var(--bg); color: var(--text); font: 15px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  /* ---------- the phone ---------- */
  .stage { height: 100%; display: grid; place-items: center; padding: 18px; }
  .phone { position: relative; width: 410px; height: min(880px, calc(100vh - 36px)); border-radius: 48px; background: var(--bg); border: 11px solid var(--bezel); box-shadow: var(--shadow); overflow: hidden; overflow: clip; display: flex; flex-direction: column; isolation: isolate; }
  .phone::before { content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 112px; height: 30px; border-radius: 20px; background: #000; z-index: 50; pointer-events: none; }
  .sbar { flex: none; height: 46px; padding: 14px 28px 0 30px; display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--text); }
  .sbar .r { display: flex; gap: 6px; align-items: center; font-size: 11px; font-weight: 600; color: var(--muted); }
  .sbar .bat { width: 22px; height: 11px; border: 1.5px solid var(--muted); border-radius: 3px; position: relative; }
  .sbar .bat::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; background: var(--text); border-radius: 1px; }
  .side-note { position: fixed; left: 24px; bottom: 20px; max-width: 260px; color: var(--muted); font-size: 12.5px; }
  .side-note b { color: var(--text); }
  @media (max-width: 560px), (max-height: 600px) {
    .stage { padding: 0; display: block; }
    .phone { width: 100%; height: 100%; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
    .phone::before, .sbar, .side-note { display: none; }
  }
  @media (max-width: 1100px) { .side-note { display: none; } }

  /* ---------- app chrome ---------- */
  .top { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 14px 10px; min-height: 52px; }
  .top h1 { flex: 1; margin: 0; font-size: 18px; font-weight: 750; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .sub { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
  .ib { flex: none; width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 17px; }
  .ib:active { transform: scale(.96); }
  .who { display: flex; gap: -6px; }
  .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; border: 2px solid var(--bg); margin-left: -6px; color: #fff; }
  .dot.student { background: linear-gradient(135deg, #1aa6b3, #d4a338); } .dot.tutor, .dot.admin { background: linear-gradient(135deg, #2563eb, #111827); } .dot.parent { background: #7c3aed; }
  main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 14px 18px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  main::-webkit-scrollbar { width: 0; }
  .tabs { flex: none; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 92%, transparent); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  .tabs button { border: 0; background: none; color: var(--faint); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 650; padding: 6px 0; border-radius: 12px; position: relative; }
  .tabs button .i { font-size: 20px; line-height: 1; filter: grayscale(.6); opacity: .8; }
  .tabs button.on { color: var(--accent2); } .tabs button.on .i { filter: none; opacity: 1; }
  .tabs .badge { position: absolute; top: 2px; right: calc(50% - 22px); min-width: 17px; height: 17px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 10px; display: grid; place-items: center; padding: 0 4px; }

  /* ---------- building blocks ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 6px; font-size: 14px; letter-spacing: .01em; }
  .muted { color: var(--muted); } .small { font-size: 12.5px; } .tiny { font-size: 11px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--surface3); color: var(--muted); white-space: nowrap; }
  .chip.draft { background: rgba(255,255,255,.08); color: var(--muted); }
  .chip.submitted { background: var(--accent-soft); color: var(--accent2); }
  .chip.revise { background: rgba(255, 138, 122, .16); color: var(--bad); }
  .chip.reviewed { background: rgba(79, 209, 165, .15); color: var(--good); }
  .chip.done { background: var(--good); color: #052e1c; }
  .btn { border: 1px solid var(--line); background: var(--surface2); color: var(--text); border-radius: 14px; padding: 10px 14px; font-weight: 650; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn.primary { background: linear-gradient(180deg, var(--accent2), var(--accent)); border-color: transparent; color: var(--accent-ink); }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--bad); }
  .btn.sm { padding: 6px 10px; font-size: 12.5px; border-radius: 11px; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .5; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .field { display: block; margin-bottom: 12px; }
  .field > span { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 5px; letter-spacing: .02em; }
  .inp { width: 100%; background: var(--surface2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; color: var(--text); font-size: 16px; }
  .inp:focus { outline: none; border-color: var(--accent); }
  textarea.inp { resize: none; line-height: 1.5; min-height: 64px; }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty .e { font-size: 46px; }

  /* ---------- library ---------- */
  .hello { margin: 4px 2px 14px; }
  .hello h2 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
  .hello p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
  .sec { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 16px 4px 8px; }
  .piece { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 13px; margin-bottom: 10px; color: var(--text); }
  .piece:active { transform: scale(.99); }
  .piece .g { flex: none; width: 44px; height: 44px; border-radius: 14px; background: var(--surface3); display: grid; place-items: center; font-size: 22px; }
  .piece .b { flex: 1; min-width: 0; }
  .piece b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .piece .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 5px; font-size: 12px; color: var(--muted); }
  .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.08); margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--cyan), var(--accent2)); }
  .livepill { color: var(--good); font-weight: 700; }
  .fab { position: absolute; right: 18px; bottom: 22px; z-index: 5; border: 0; border-radius: 20px; padding: 14px 18px; font-weight: 800; font-size: 15px; background: linear-gradient(180deg, var(--accent2), var(--accent)); color: var(--accent-ink); box-shadow: 0 10px 28px rgba(0,0,0,.45); }

  /* ---------- writing ---------- */
  .prompt { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 18px; padding: 11px 13px; margin-bottom: 10px; font-size: 14px; }
  .prompt .k { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--accent2); }
  .lockbar { display: flex; gap: 10px; align-items: center; background: var(--surface2); border: 1px dashed var(--line); border-radius: 16px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
  .title-in { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 6px 2px 8px; font-size: 22px; font-weight: 800; letter-spacing: -.01em; color: var(--text); }
  .title-in:focus { outline: none; border-color: var(--accent); }
  .paper { position: relative; margin-top: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; }
  #editor { display: block; width: 100%; min-height: 46vh; border: 0; background: transparent; color: var(--paper-ink); caret-color: var(--caret); padding: 16px 16px 30px; font: 18px/1.75 "Georgia", "Iowan Old Style", "Palatino", serif; resize: none; }
  #editor:focus { outline: none; }
  #editor::placeholder { color: var(--faint); font-style: italic; }
  #editor[readonly] { opacity: .85; }
  .tools { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .tools::-webkit-scrollbar { display: none; }
  .tools .btn { flex: none; }
  .stats { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); background: var(--surface); }
  .ring { --p: 0; width: 30px; height: 30px; border-radius: 50%; background: conic-gradient(var(--accent2) calc(var(--p) * 1%), rgba(255,255,255,.1) 0); display: grid; place-items: center; flex: none; }
  .ring::after { content: ""; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); }
  .saved { margin-left: auto; font-weight: 700; }
  .saved.bad { color: var(--bad); }

  /* rendered text (reading, comments) */
  .read { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 16px; color: var(--paper-ink); font: 17.5px/1.75 "Georgia", "Iowan Old Style", "Palatino", serif; white-space: pre-wrap; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; min-height: 120px; }
  .read h2 { font: 800 21px/1.3 "Inter", system-ui, sans-serif; margin: 0 0 10px; white-space: normal; }
  .read mark { background: var(--hl); color: inherit; border-bottom: 2px solid var(--hl-line); border-radius: 3px; padding: 0 1px; cursor: pointer; }
  .read mark.sel { background: color-mix(in srgb, var(--hl-line) 50%, transparent); }
  .caretmark { display: inline-block; width: 2px; height: 1.15em; margin: 0 -1px; vertical-align: -.2em; background: var(--caret); animation: blink 1s steps(2) infinite; position: relative; }
  .caretmark::after { content: attr(data-n); position: absolute; left: -2px; top: -16px; font: 700 9.5px/1 system-ui; color: #111; background: var(--caret); padding: 2px 4px; border-radius: 4px; white-space: nowrap; }
  @keyframes blink { 50% { opacity: .25; } }
  .typing { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--accent2); font-weight: 700; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); animation: bounce 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 50% { transform: translateY(-3px); opacity: .5; } }
  .selbar { position: absolute; left: 12px; right: 12px; bottom: 76px; z-index: 30; display: flex; gap: 8px; padding: 8px; border-radius: 18px; background: var(--surface3); border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(0,0,0,.5); animation: up .18s ease-out; }
  .selbar .q { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; align-self: center; padding-left: 6px; }
  @keyframes up { from { transform: translateY(12px); opacity: 0; } }

  /* plan */
  .plan-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px; margin-bottom: 10px; }
  .plan-card label { display: flex; gap: 8px; align-items: baseline; font-weight: 750; font-size: 14px; margin-bottom: 2px; }
  .plan-card .hint { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .plan-card textarea { width: 100%; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; color: var(--text); font-size: 16px; line-height: 1.5; resize: none; min-height: 52px; }
  .plan-card textarea:focus { outline: none; border-color: var(--accent); }
  .plan-card .ro { white-space: pre-wrap; font-size: 15px; color: var(--paper-ink); min-height: 1.4em; }
  .plan-card .ro:empty::before { content: "Not filled in yet"; color: var(--faint); font-style: italic; }
  .steps { display: flex; gap: 4px; margin: 2px 0 12px; }
  .steps i { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); }
  .steps i.on { background: var(--accent2); }

  /* feedback */
  .glow { border-left: 4px solid var(--good); }
  .growc { border-left: 4px solid var(--accent2); }
  .fbtext { white-space: pre-wrap; font-size: 14.5px; }
  .trait { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
  .trait:first-of-type { border-top: 0; }
  .trait .n { font-weight: 700; font-size: 14px; }
  .trait .d { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
  .score { display: flex; gap: 4px; }
  .score button, .score span { width: 32px; height: 30px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); font-weight: 800; font-size: 13px; display: grid; place-items: center; color: var(--muted); }
  .score .on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .cmt { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px; margin-bottom: 10px; }
  .cmt.resolved { opacity: .55; }
  .cmt .qt { font: italic 14px/1.5 Georgia, serif; color: var(--paper-ink); border-left: 3px solid var(--hl-line); padding: 2px 0 2px 10px; margin-bottom: 8px; cursor: pointer; }
  .cmt .hd { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .cmt .hd b { color: var(--text); }
  .cmt .tx { white-space: pre-wrap; font-size: 14.5px; }
  .sugg { margin-top: 8px; background: var(--surface2); border-radius: 12px; padding: 8px 10px; font-size: 14px; }
  .sugg del { color: var(--bad); } .sugg ins { color: var(--good); text-decoration: none; font-weight: 650; }
  .reply { margin: 8px 0 0 14px; padding-left: 10px; border-left: 2px solid var(--line); font-size: 13.5px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--surface2); border-radius: 14px; padding: 9px 8px; text-align: center; }
  .stat b { display: block; font-size: 18px; } .stat span { font-size: 11px; color: var(--muted); }
  .checks { list-style: none; margin: 0; padding: 0; }
  .checks li { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .checks li:first-child { border-top: 0; }
  .checks .ck { flex: none; width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 13px; }
  .checks .ck.on { background: var(--good); border-color: var(--good); color: #052e1c; }
  .checks .auto { font-size: 11px; color: var(--faint); }
  .diff { white-space: pre-wrap; font: 15.5px/1.7 Georgia, serif; color: var(--paper-ink); }
  .diff ins { background: rgba(79, 209, 165, .2); color: var(--good); text-decoration: none; border-radius: 3px; }
  .diff del { background: rgba(255, 138, 122, .16); color: var(--bad); border-radius: 3px; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .quick button { border: 1px solid var(--line); background: var(--surface2); border-radius: 999px; padding: 5px 10px; font-size: 12.5px; color: var(--text); }

  /* sheets, toasts */
  .scrim { position: absolute; inset: 0; z-index: 40; background: rgba(0,0,0,.5); opacity: 0; transition: opacity .2s; }
  .scrim.on { opacity: 1; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 88%; display: flex; flex-direction: column; background: var(--surface); border-top: 1px solid var(--line); border-radius: 26px 26px 0 0; transform: translateY(100%); transition: transform .24s cubic-bezier(.2,.8,.2,1); padding-bottom: env(safe-area-inset-bottom); }
  .sheet.on { transform: none; }
  .sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 2px; flex: none; }
  .sheet .sh { display: flex; align-items: center; gap: 8px; padding: 6px 16px 10px; flex: none; }
  .sheet .sh h3 { flex: 1; margin: 0; font-size: 17px; }
  .sheet .sb { overflow-y: auto; padding: 0 16px 18px; }
  .genres { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .genre { text-align: left; border: 1px solid var(--line); background: var(--surface2); border-radius: 16px; padding: 10px; color: var(--text); }
  .genre.on { border-color: var(--accent); background: var(--accent-soft); }
  .genre .e { font-size: 22px; } .genre b { display: block; font-size: 13.5px; margin-top: 2px; } .genre span { font-size: 11.5px; color: var(--muted); }
  .ideas button { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 9px 2px; font-size: 14px; color: var(--text); }
  .wb-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; scrollbar-width: none; }
  .wb-tabs button { flex: none; border: 1px solid var(--line); background: var(--surface2); border-radius: 999px; padding: 6px 11px; font-size: 12.5px; color: var(--muted); }
  .wb-tabs button.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .words { display: flex; flex-wrap: wrap; gap: 6px; }
  .words button { border: 1px solid var(--line); background: var(--surface3); border-radius: 10px; padding: 7px 10px; font-size: 14px; color: var(--text); }
  .toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 60; background: var(--surface3); border: 1px solid var(--line); color: var(--text); padding: 10px 16px; border-radius: 14px; font-size: 13.5px; font-weight: 650; box-shadow: 0 10px 30px rgba(0,0,0,.4); max-width: 88%; text-align: center; animation: up .2s; }
  .focus .top, .focus .tabs, .focus .prompt, .focus .tools, .focus .lockbar { display: none; }
  .focus main { padding-top: 10px; }
  .focus #editor { min-height: 70vh; }
  .exitfocus { position: absolute; top: 54px; right: 16px; z-index: 20; }
  @media (max-width: 560px), (max-height: 600px) { .exitfocus { top: 10px; } .selbar { bottom: calc(70px + env(safe-area-inset-bottom)); } }
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="sbar"><span id="clock">9:41</span><span class="r"><span id="roleTag"></span> ▂▄▆ <span class="bat"></span></span></div>
    <header class="top" id="top"></header>
    <main id="main"><div class="empty"><div class="e">✍️</div><p>Loading…</p></div></main>
    <div class="stats" id="stats" hidden></div>
    <nav class="tabs" id="tabs" hidden></nav>
    <div class="scrim" id="scrim" hidden></div>
    <div class="sheet" id="sheet"><div class="grab"></div><div class="sh"><h3 id="shTitle"></h3><button class="ib" id="shClose" aria-label="Close">✕</button></div><div class="sb" id="shBody"></div></div>
  </div>
</div>

const TRANS = ["first", "next", "then", "after that", "later", "meanwhile", "suddenly", "finally", "in the end", "before long", "at that moment", "the next day", "afterward", "soon", "eventually", "because", "for example", "also", "therefore", "however", "in addition", "another", "most importantly", "to sum up", "as a result"];

const FEEL = ["happy", "sad", "proud", "scared", "nervous", "excited", "angry", "relieved", "worried", "afraid", "thrilled", "embarrass", "frustrat", "grateful", "lonely", "surprised", "confident", "terrified", "heart", "tears", "smile", "laugh", "cried", "shaking", "butterflies"];
const OVERUSED = ["very", "really", "so", "then", "good", "bad", "nice", "thing", "things", "stuff", "got", "a lot", "just", "like", "fun"];
function analyze(text) {
  const t = String(text || ""), low = t.toLowerCase();
  const words = t.match(/[A-Za-z0-9À-ɏሀ-፿]+(?:['’-][A-Za-z0-9À-ɏሀ-፿]+)*/g) || [];
  const sentences = t.split(/(?<=[.!?])["”']?\s+|\n+/).map(s => s.trim()).filter(s => /[A-Za-zሀ-፿]/.test(s));
  const paras = t.split(/\n\s*\n|\n/).filter(p => p.trim().split(/\s+/).length >= 4).length;
  const syl = w => { w = w.toLowerCase().replace(/[^a-z]/g, ""); if (w.length <= 3) return 1; w = w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, "").replace(/^y/, ""); const m = w.match(/[aeiouy]{1,2}/g); return Math.max(1, m ? m.length : 1); };

  const has = list => list.filter(w => new RegExp(`\\b${w}`, "i").test(low));
  const firstPerson = (low.match(/\b(i|me|my|mine|we|our)\b/g) || []).length;

  const senses = has(SENSE), feelings = has(FEEL);

  const over = OVERUSED.map(w => [w, w.includes(" ") ? (low.match(new RegExp(`\\b${w}\\b`, "g")) || []).length : counts[w] || 0]).filter(([, n]) => n >= 3).sort((a, b) => b[1] - a[1]);
  const starts = {}; sentences.forEach(s => { const w = (s.match(/[A-Za-z]+/) || [""])[0].toLowerCase(); if (w) starts[w] = (starts[w] || 0) + 1; });
  const sameStarts = Object.entries(starts).filter(([, n]) => n >= 3 && sentences.length >= 5).sort((a, b) => b[1] - a[1]);

}

/* =====================================================================
   A piece: live connection
   ===================================================================== */
async function openPiece(id, tab) {
  closeLive();
  let r; try { r = await api("GET", `/api/writing/${id}`); } catch (e) { return toast(e.message); }
  P = r.piece; versions = r.versions; PERM = { canWrite: r.canWrite, isOwner: r.isOwner, canReview: r.canReview };
  try { checksDone = JSON.parse(localStorage.getItem(`ws-checks-${P.id}`) || "{}"); } catch { checksDone = {}; }
  TAB = tab || (PERM.isOwner ? (P.body.trim() ? "write" : "plan") : (P.status === "submitted" ? "review" : "read"));
  pending = false; saveState = "saved";
  render();
  connect();
}
function connect() {
  if (!P) return;
  ES = new EventSource(`/api/writing/${P.id}/events?cid=${CID}`);
  ES.addEventListener("snapshot", e => { const d = JSON.parse(e.data); PERM = { canWrite: d.canWrite, isOwner: d.isOwner, canReview: d.canReview }; if (!pending) { P = d.piece; render(true); } else { Object.assign(P, without(d.piece, ["body", "plan", "title", "version"])); } });
  ES.addEventListener("text", e => {
    const d = JSON.parse(e.data); if (!P) return;
    if (PERM.isOwner && pending) return;            // my own other screen; mine wins, a conflict is caught on save
    P.body = d.body; P.plan = d.plan; P.title = d.title; P.words = d.words; P.version = d.v;
    liveRefresh();
  });
  ES.addEventListener("update", e => {
    const d = JSON.parse(e.data); if (!P || d.id !== P.id) return;
    const keep = PERM.isOwner && pending ? { body: P.body, plan: P.plan, title: P.title, version: P.version } : {};
    const statusChanged = d.status !== P.status;
    P = Object.assign(d, keep);
    if (statusChanged) { PERM.canWrite = PERM.isOwner && ["draft", "revise", "reviewed"].includes(P.status); if (P.status !== myStatus) toast(`${STATUS[P.status][1]} ${STATUS[P.status][0]}`); myStatus = null; render(true); }
    else liveRefresh(true);
  });
  ES.addEventListener("presence", e => { PEOPLE = JSON.parse(e.data); drawWho(); });
  ES.addEventListener("live", e => { const d = JSON.parse(e.data); REMOTE[d.cid] = { ...d, at: Date.now() }; drawTyping(); if (TAB === "read") drawRead(); });
  ES.addEventListener("deleted", () => { toast("This writing was deleted"); showLibrary(); });
}
function closeLive() { if (ES) ES.close(); ES = null; PEOPLE = []; REMOTE = {}; clearTimeout(sendTimer); }
const without = (o, keys) => Object.fromEntries(Object.entries(o).filter(([k]) => !keys.includes(k)));
setInterval(() => { const now = Date.now(); let ch = false; for (const k in REMOTE) if (now - REMOTE[k].at > 4000) { delete REMOTE[k]; ch = true; } if (ch) { drawTyping(); if (TAB === "read") drawRead(); } }, 1500);

/* ---------- saving the student's text ---------- */
function queueSave() {
  pending = true; setSaved("typing");
  clearTimeout(sendTimer); sendTimer = setTimeout(sendText, Date.now() - lastSentAt > 1500 ? 60 : 700);
  const now = Date.now();
  if (now - lastLive > 1200 && PEOPLE.length > 1) { lastLive = now; const ed = $("editor"); api("POST", `/api/writing/${P.id}/live`, { cid: CID, k: "typing", pos: ed ? ed.selectionStart : 0, field: TAB === "plan" ? "plan" : "body" }).catch(() => {}); }
}
async function sendText() {
  if (!P || !pending) return;
  if (sending) { clearTimeout(sendTimer); sendTimer = setTimeout(sendText, 400); return; }
  sending = true; pending = false; lastSentAt = Date.now(); setSaved("saving");
  const snap = { body: P.body, plan: P.plan, title: P.title, v: P.version, cid: CID };
  try {
    const r = await api("POST", `/api/writing/${P.id}/text`, snap);
    P.version = r.v; P.words = r.words; setSaved(pending ? "typing" : "saved");
    try { localStorage.removeItem(`ws-backup-${P.id}`); } catch {}
  } catch (e) {
    if (e.status === 409 && e.data && e.data.piece) {
      // changed on another of my screens: keep a copy of what I typed, then load the newest
      try { localStorage.setItem(`ws-backup-${P.id}`, JSON.stringify(snap)); } catch {}
      P = e.data.piece; pending = false; render(true); toast("This writing changed on another screen. Loaded the newest version.", 4000);
    } else if (e.status === 423 || e.status === 403) { pending = false; toast(e.message, 3500); render(true); }
    else { pending = true; setSaved("offline"); clearTimeout(sendTimer); sendTimer = setTimeout(sendText, 4000); try { localStorage.setItem(`ws-backup-${P.id}`, JSON.stringify(snap)); } catch {} }
  } finally { sending = false; if (pending) { clearTimeout(sendTimer); sendTimer = setTimeout(sendText, 500); } }
}
function setSaved(s) { saveState = s; const el = $("savedTag"); if (!el) return; el.className = "saved" + (s === "offline" ? " bad" : ""); el.textContent = { typing: "…", saving: "Saving…", saved: "Saved ✓", offline: "Offline: will retry" }[s]; }

// Something changed remotely: refresh only what the viewer is looking at, without disturbing typing
function liveRefresh(meta) {

/* ---------- reading view with highlights and the live caret ---------- */
function locate(body, quote, start) { if (!quote) return -1; let best = -1, bd = Infinity, i = body.indexOf(quote); while (i >= 0) { const d = Math.abs(i - start); if (d < bd) { best = i; bd = d; } i = body.indexOf(quote, i + 1); } return best; }

  const ranges = [];

  const cuts = new Set([0, body.length]); ranges.forEach(([a, b]) => { cuts.add(a); cuts.add(b); }); if (caret !== null) cuts.add(Math.min(caret, body.length));
  const pts = [...cuts].sort((x, y) => x - y); let html = "";

    if (b === undefined || b <= a) continue;

    html += hit.length ? `<mark data-o="${a}" data-c="${hit.map(h => h[2]).join(" ")}" class="${hit.some(h => h[2] === activeId) ? "sel" : ""}">${seg}</mark>` : `<span data-o="${a}">${seg}</span>`;
  }

}

  const n = A.length, m = B.length, L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, out = "", cur = null, buf = "";
  const flush = () => { if (buf) out += cur === "+" ? `<ins>${esc(buf)}</ins>` : cur === "-" ? `<del>${esc(buf)}</del>` : esc(buf); buf = ""; };
  const push = (t, s) => { if (t !== cur) { flush(); cur = t; } buf += s; };
  while (i < n && j < m) { if (A[i] === B[j]) { push("=", A[i]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) push("-", A[i++]); else push("+", B[j++]); }
  while (i < n) push("-", A[i++]); while (j < m) push("+", B[j++]); flush();
  return out || '<span class="muted">No changes.</span>';
}

/* =====================================================================
   Sheets
   ===================================================================== */
function openSheet(title, html, wire) {
  const ctx = { html: typeof html === "function" ? html : () => html };
  $("shTitle").textContent = title; $("shBody").innerHTML = ctx.html(); $("shBody").scrollTop = 0;
  $("scrim").hidden = false; requestAnimationFrame(() => { $("scrim").classList.add("on"); $("sheet").classList.add("on"); });
  if (wire) wire.call(ctx, $("shBody"));
}
function closeSheet() { $("scrim").classList.remove("on"); $("sheet").classList.remove("on"); setTimeout(() => { $("scrim").hidden = true; }, 220); }
$("scrim").onclick = closeSheet; $("shClose").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape") { if ($("sheet").classList.contains("on")) closeSheet(); else if (focusMode) toggleFocus(false); } });

/* =====================================================================
   Start
   ===================================================================== */
$("sideNote").innerHTML = IS_STUDENT || VIEWER.role === "parent" ? "" : `<b>Tip:</b> open this on your phone too. ${STUDENT ? esc(first(STUDENT.name)) + "'s" : "The student's"} writing appears here live as they type, with a gold cursor showing where they are.`;
(async () => {
  const want = new URLSearchParams(location.search).get("piece");
  await showLibrary();
  if (want && LIST && LIST.some(p => p.id === +want)) openPiece(+want);
})();
