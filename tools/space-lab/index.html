<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
  :root {
    --navy: #0a1a3f; --deep: #030716; --panel: rgba(10, 20, 48, .86); --panel2: rgba(20, 36, 78, .9); --line: rgba(160, 190, 255, .16);
    --text: #eef3ff; --muted: #9fb0d6; --faint: #6b7da6;
    --red: #e0323f; --red2: #ff5866; --blue: #2a5bd7; --blue2: #6c9bff; --white: #ffffff; --gold: #f5c451; --gold2: #ffdd7a; --good: #3ddc97; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--deep); color: var(--text); font: 15px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  #sky { position: fixed; inset: 0; z-index: 0; }
  .app { position: relative; z-index: 1; height: 100%; height: 100dvh; display: flex; flex-direction: column; }

  /* top bar with the stars and stripes */
  .top { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: linear-gradient(180deg, rgba(3, 7, 22, .95), rgba(3, 7, 22, .6)); }
  .top .logo { width: 36px; height: 36px; border-radius: 50%; background: #fff; object-fit: contain; flex: none; }
  .top .brand { line-height: 1.1; min-width: 0; }
  .top .brand b { display: block; font-size: 15px; letter-spacing: .01em; white-space: nowrap; }
  .top .brand span { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .top .flag { flex: none; height: 22px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(255,255,255,.2); }
  .top .sp { flex: 1; }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 22px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.14); }
  .dots i.done { background: var(--gold); } .dots i.on { background: linear-gradient(90deg, var(--red2), var(--white), var(--blue2)); }
  .stripes { flex: none; height: 4px; background: repeating-linear-gradient(90deg, var(--red) 0 22px, var(--white) 22px 44px); opacity: .9; }
  .pts { flex: none; font-weight: 800; font-size: 13px; background: rgba(245, 196, 81, .14); color: var(--gold2); border: 1px solid rgba(245, 196, 81, .35); padding: 4px 10px; border-radius: 999px; }

  /* mission layout: picture on the left/top, panel on the right/bottom */
  .stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 390px; }
  .view { position: relative; min-height: 0; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .panel { min-height: 0; overflow-y: auto; padding: 16px 18px 22px; background: var(--panel); border-left: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .panel::-webkit-scrollbar { width: 6px; } .panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 3px; }
  @media (max-width: 820px) {
    .stage { grid-template-columns: 1fr; grid-template-rows: minmax(240px, 52%) minmax(0, 1fr); }
    .panel { border-left: 0; border-top: 1px solid var(--line); padding: 14px 14px 22px; }
    .top .brand span, .dots { display: none; }
  }
  .kicker { font-size: 11.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
  h1 { font-size: 24px; line-height: 1.15; margin: 4px 0 8px; letter-spacing: -.01em; }
  h2 { font-size: 18px; margin: 0 0 6px; }
  h3 { font-size: 14.5px; margin: 0 0 6px; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); } .small { font-size: 13px; } .tiny { font-size: 11.5px; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin: 10px 0; }
  .goal { display: flex; gap: 10px; align-items: flex-start; background: rgba(42, 91, 215, .18); border: 1px solid rgba(108, 155, 255, .35); border-radius: 14px; padding: 10px 12px; margin: 10px 0; font-size: 14px; }
  .goal.done { background: rgba(61, 220, 151, .14); border-color: rgba(61, 220, 151, .45); }
  .goal .gi { font-size: 18px; }
  .btn { border: 1px solid var(--line); background: rgba(255,255,255,.07); color: var(--text); border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn:hover { background: rgba(255,255,255,.12); }
  .btn.go { background: linear-gradient(180deg, var(--red2), var(--red)); border-color: transparent; color: #fff; box-shadow: 0 6px 18px rgba(224, 50, 63, .35); }
  .btn.blue { background: linear-gradient(180deg, var(--blue2), var(--blue)); border-color: transparent; color: #fff; }
  .btn.gold { background: linear-gradient(180deg, var(--gold2), var(--gold)); border-color: transparent; color: #241800; }
  .btn.sm { padding: 6px 10px; font-size: 12.5px; border-radius: 10px; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .seg { display: inline-flex; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: none; padding: 6px 10px; border-radius: 9px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
  .seg button.on { background: var(--blue); color: #fff; }
  label.sl { display: block; margin: 10px 0; font-size: 13px; color: var(--muted); }
  label.sl b { color: var(--text); }
  input[type=range] { width: 100%; accent-color: var(--red2); height: 28px; }
  .inp { width: 100%; background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 16px; color: var(--text); }
  .inp:focus { outline: none; border-color: var(--blue2); }
  .readout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0; }
  .readout div { background: rgba(255,255,255,.05); border-radius: 12px; padding: 7px 6px; text-align: center; }
  .readout b { display: block; font-size: 16px; } .readout span { font-size: 11px; color: var(--muted); }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 13px; margin: 8px 0; }
  .facts span { color: var(--muted); display: block; font-size: 11.5px; }
  .big { font-size: 22px; font-weight: 800; color: var(--gold2); }
  .toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); z-index: 50; background: rgba(10, 20, 48, .96); border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.5); text-align: center; max-width: 90vw; animation: pop .25s; }
  .toast.win { border-color: var(--gold); color: var(--gold2); }
  @keyframes pop { from { transform: translate(-50%, -8px) scale(.96); opacity: 0; } }
  .hud { position: absolute; left: 12px; top: 12px; z-index: 2; font-size: 12.5px; color: var(--muted); background: rgba(3, 7, 22, .6); border: 1px solid var(--line); padding: 6px 10px; border-radius: 10px; pointer-events: none; max-width: calc(100% - 24px); }
  .hud b { color: var(--text); }
  .banner { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 2; background: rgba(3, 7, 22, .78); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; font-size: 13.5px; text-align: center; width: max-content; max-width: calc(100% - 24px); }

  /* questions */
  .q { margin-top: 12px; }
  .q .opts { display: grid; gap: 7px; margin-top: 8px; }
  .q .opts button { text-align: left; border: 1px solid var(--line); background: rgba(255,255,255,.06); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; color: var(--text); }
  .q .opts button:hover:not(:disabled) { border-color: var(--blue2); }
  .q .opts button.right { background: rgba(61, 220, 151, .2); border-color: var(--good); }
  .q .opts button.wrong { background: rgba(255, 107, 107, .16); border-color: var(--bad); }
  .q .why { margin-top: 8px; font-size: 13.5px; color: var(--muted); }

  /* welcome, end, locked */
  .center { position: relative; z-index: 1; flex: 1; overflow-y: auto; display: flex; justify-content: center; padding: 20px 16px 40px; }
  .hero { width: min(640px, 100%); margin: auto 0; }
  .hero .badge { display: inline-flex; gap: 8px; align-items: center; background: rgba(224, 50, 63, .16); border: 1px solid rgba(255, 88, 102, .45); color: #ffd6da; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 800; letter-spacing: .04em; }
  .hero h1 { font-size: clamp(30px, 6vw, 46px); margin: 14px 0 10px; line-height: 1.05; letter-spacing: -.02em; }
  .hero h1 .r { color: var(--red2); } .hero h1 .b { color: var(--blue2); }
  .missions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
  .missions div { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 14px; padding: 10px; font-size: 12.5px; font-weight: 700; }
  .missions div i { display: block; font-style: normal; font-size: 22px; }
  @media (max-width: 520px) { .missions { grid-template-columns: repeat(2, 1fr); } }
  .grades { display: flex; flex-wrap: wrap; gap: 6px; }
  .grades button { min-width: 46px; border: 1px solid var(--line); background: rgba(255,255,255,.06); border-radius: 12px; padding: 9px 10px; font-weight: 800; }
  .grades button.on { background: var(--blue); border-color: var(--blue2); }
  .glass { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 18px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .cert-prev { width: 100%; border-radius: 12px; border: 1px solid var(--line); display: block; }
  .rank { font-size: 30px; font-weight: 900; background: linear-gradient(90deg, var(--red2), #fff, var(--blue2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--muted); margin: 8px 0 12px; }
  .consent input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--red2); flex: none; }
  .err { color: var(--bad); font-weight: 700; min-height: 1.2em; font-size: 13.5px; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="app" id="app"></div>
<script src="/qr.js"></script>
<script>
"use strict";
/* =====================================================================
   Where we are: the public one-time page (/space), or a tool for students
   ===================================================================== */
const AM = window.AMT || null;
const PUB = window.SPACE && window.SPACE.public ? window.SPACE : null;
const APP_URL = (PUB && PUB.appUrl) || location.origin;
const LOGO = (PUB && PUB.logo) || "https://res.cloudinary.com/dnxsqsccu/image/upload/v1785330959/afromerica/logo.png";
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n, d = 0) => Number(n).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2;
const STORE = "amt-space-v1";
const SRC = (new URLSearchParams(location.search).get("src") || "").slice(0, 40);
function toast(msg, win) { const t = document.createElement("div"); t.className = "toast" + (win ? " win" : ""); t.innerHTML = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }
async function post(path, body) { const r = await fetch(path, { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json", "X-AMT": "1" }, body: JSON.stringify(body || {}) }); let j = {}; try { j = await r.json(); } catch {} if (!r.ok) { const e = new Error(j.error || "Something went wrong. Please try again."); e.status = r.status; e.data = j; throw e; } return j; }

/* U.S. flag (13 stripes, 50 stars), drawn here so it is crisp at any size */
function flagSVG(h = 22) {
  const w = h * 1.9, s = h / 13, cw = w * .4, ch = s * 7; let stars = "";
  for (let r = 0; r < 9; r++) for (let c = 0; c < (r % 2 ? 5 : 6); c++) { const x = cw * ((c * 2 + (r % 2 ? 2 : 1)) / 12), y = ch * ((r + 1) / 10); stars += `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${(s * .28).toFixed(2)}" fill="#fff"/>`; }
  let stripes = ""; for (let i = 0; i < 13; i++) stripes += `<rect y="${(i * s).toFixed(2)}" width="${w}" height="${(s + .05).toFixed(2)}" fill="${i % 2 ? "#fff" : "#B22234"}"/>`;
  return `<svg class="flag" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-label="United States flag" role="img">${stripes}<rect width="${cw}" height="${ch}" fill="#3C3B6E"/>${stars}</svg>`;
}
function drawFlag(g, x, y, h) {
  const w = h * 1.9, s = h / 13, cw = w * .4, ch = s * 7;
  for (let i = 0; i < 13; i++) { g.fillStyle = i % 2 ? "#fff" : "#B22234"; g.fillRect(x, y + i * s, w, s + .5); }
  g.fillStyle = "#3C3B6E"; g.fillRect(x, y, cw, ch); g.fillStyle = "#fff";
  for (let r = 0; r < 9; r++) for (let c = 0; c < (r % 2 ? 5 : 6); c++) { g.beginPath(); g.arc(x + cw * ((c * 2 + (r % 2 ? 2 : 1)) / 12), y + ch * ((r + 1) / 10), s * .28, 0, TAU); g.fill(); }
}

/* =====================================================================
   The starry sky behind everything
   ===================================================================== */
const sky = $("sky"), sg = sky.getContext("2d"); let STARS = [];
function sizeSky() {
  const d = Math.min(2, devicePixelRatio || 1); sky.width = innerWidth * d; sky.height = innerHeight * d; sky.style.width = innerWidth + "px"; sky.style.height = innerHeight + "px"; sg.setTransform(d, 0, 0, d, 0, 0);
  STARS = Array.from({ length: Math.round(innerWidth * innerHeight / 2600) }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 1.3 + .2, t: Math.random() * TAU, c: Math.random() < .12 ? (Math.random() < .5 ? "#ffd2d6" : "#cfe0ff") : "#fff" }));
}
function drawSky(t) {
  const W = innerWidth, H = innerHeight;
  const g = sg.createRadialGradient(W * .75, H * .1, 0, W * .75, H * .1, Math.max(W, H) * .9);
  g.addColorStop(0, "#14204a"); g.addColorStop(.45, "#070d26"); g.addColorStop(1, "#02040c"); sg.fillStyle = g; sg.fillRect(0, 0, W, H);
  const n = sg.createRadialGradient(W * .15, H * .85, 0, W * .15, H * .85, W * .5); n.addColorStop(0, "rgba(178, 34, 52, .16)"); n.addColorStop(1, "rgba(178, 34, 52, 0)"); sg.fillStyle = n; sg.fillRect(0, 0, W, H);
  for (const s of STARS) { sg.globalAlpha = .45 + .55 * Math.abs(Math.sin(s.t + t * .0007)); sg.fillStyle = s.c; sg.beginPath(); sg.arc(s.x, s.y, s.r, 0, TAU); sg.fill(); }
  sg.globalAlpha = 1;
}
sizeSky(); addEventListener("resize", sizeSky);

/* =====================================================================
   Player, scoring, saving
   ===================================================================== */
const MISSIONS = [
  { id: 1, e: "🪐", t: "Solar System Flight" }, { id: 2, e: "🚀", t: "Launch to Orbit" }, { id: 3, e: "🌌", t: "Build a Solar System" },
  { id: 4, e: "🌗", t: "Moon & Eclipses" }, { id: 5, e: "⚡", t: "Race the Light" }, { id: 6, e: "🎖️", t: "Final Challenge" },
];
let ST = { status: "new" };
let S = { name: "", grade: 7, mission: 0, points: 0, done: {}, answered: {}, quiz: null, finished: false, lead: false, cert: null, age: null, weight: null };
const band = () => S.grade <= 6 ? 0 : S.grade <= 8 ? 1 : 2;
const TOTAL = 16;   // 5 mission goals + 5 checkpoint questions + 6 final questions
function save() { try { localStorage.setItem(STORE + (AM && AM.student ? "-" + AM.student.id : ""), JSON.stringify(S)); } catch {} }
function load() { try { const v = JSON.parse(localStorage.getItem(STORE + (AM && AM.student ? "-" + AM.student.id : "")) || "null"); if (v && v.name) S = Object.assign(S, v); } catch {} }
function award(key, msg) { if (S.done[key]) return; S.done[key] = true; S.points++; save(); toast(`⭐ ${msg} <b>+1</b>`, true); drawTop(); }

/* =====================================================================
   Questions (harder for older students)
   ===================================================================== */
const CHECK = {
  1: [{ q: "Which planet is closest to the Sun?", o: ["Mercury", "Venus", "Earth", "Mars"], a: 0, w: "Mercury is closest. It zips around the Sun in just 88 days." },
      { q: "A Mars year is about 687 Earth days. If you are 12 years old on Earth, about how old are you on Mars?", o: ["About 6", "About 12", "About 24", "About 2"], a: 0, w: "12 × 365 ÷ 687 ≈ 6.4. A Mars year is almost twice as long, so you'd be about half your age." },
      { q: "Jupiter's year is 11.86 Earth years. Using Kepler's third law (T² = a³, T in years, a in AU), how far is Jupiter from the Sun?", o: ["About 5.2 AU", "About 11.9 AU", "About 3.4 AU", "About 140 AU"], a: 0, w: "a = T^(2/3) = 11.86^(2/3) ≈ 5.2 AU." }],
  2: [{ q: "What keeps a satellite in orbit around Earth?", o: ["It moves sideways so fast that it keeps falling around Earth", "There is no gravity in space", "Its rockets push it all the time", "It floats on the air"], a: 0, w: "Gravity pulls it down, but it moves sideways so fast that Earth curves away under it. It's always falling, and always missing!" },
      { q: "About how fast must a spacecraft move sideways to orbit just above Earth?", o: ["17,500 mph", "1,000 mph", "500 mph", "100,000 mph"], a: 0, w: "About 17,500 mph (7.8 km/s). That's New York to Los Angeles in about 10 minutes!" },
      { q: "Orbital speed is v = √(GM/r). If the orbit radius r becomes 4 times bigger, the speed becomes…", o: ["Half as fast", "A quarter as fast", "Twice as fast", "The same"], a: 0, w: "v ∝ 1/√r, and √4 = 2, so the speed is halved." }],
  3: [{ q: "What pulls the planets into orbits around the Sun?", o: ["Gravity", "Magnetism", "Solar wind", "Sunlight"], a: 0, w: "The Sun's gravity pulls every planet toward it. Their sideways motion turns that pull into an orbit." },
      { q: "Planets closer to the Sun move…", o: ["Faster", "Slower", "At the same speed", "They don't move"], a: 0, w: "Closer means stronger gravity, so they must move faster to stay in orbit. Mercury is fastest." },
      { q: "If the distance between two objects doubles, the gravity force between them becomes…", o: ["¼ as strong", "½ as strong", "2 times stronger", "4 times stronger"], a: 0, w: "Gravity follows an inverse-square law: F ∝ 1/r². Doubling r gives 1/2² = 1/4." }],
  4: [{ q: "Why does the Moon have phases?", o: ["We see different amounts of its sunlit half", "Earth's shadow covers part of it", "Clouds block part of it", "The Moon changes shape"], a: 0, w: "Half of the Moon is always lit by the Sun. As it orbits, we see more or less of that lit half." },
      { q: "During a solar eclipse, which one is in the middle?", o: ["The Moon", "Earth", "The Sun"], a: 0, w: "Sun, Moon, Earth: the Moon blocks the Sun's light. In a lunar eclipse, Earth is in the middle." },
      { q: "Why isn't there an eclipse every month?", o: ["The Moon's orbit is tilted about 5° to Earth's orbit", "The Moon is too small", "Earth spins too fast", "The Sun is too bright"], a: 0, w: "Most months the Moon passes a little above or below the Sun–Earth line, so there's no eclipse." }],
  5: [{ q: "Sunlight takes about how long to reach Earth?", o: ["8 minutes", "8 seconds", "8 hours", "8 days"], a: 0, w: "About 8 minutes 20 seconds. When you see the Sun, you see it as it was 8 minutes ago!" },
      { q: "Light travels about 186,000 miles each second. How long does it take light to travel 372,000 miles?", o: ["2 seconds", "1 second", "186 seconds", "½ second"], a: 0, w: "time = distance ÷ speed = 372,000 ÷ 186,000 = 2 seconds." },
      { q: "Proxima Centauri is 4.24 light-years away. With 1 light-year ≈ 9.46 × 10¹² km, that is about…", o: ["4.0 × 10¹³ km", "4.0 × 10¹² km", "2.2 × 10¹² km", "9.5 × 10¹⁶ km"], a: 0, w: "4.24 × 9.46 × 10¹² ≈ 40.1 × 10¹² = 4.0 × 10¹³ km." }],
};
const QUIZ = [
  [{ q: "Which is the largest planet?", o: ["Jupiter", "Saturn", "Earth", "Neptune"], a: 0, w: "Jupiter is so big that more than 1,300 Earths could fit inside it." },
   { q: "Which planet is called the Red Planet?", o: ["Mars", "Venus", "Mercury", "Jupiter"], a: 0, w: "Rusty iron in its soil makes Mars look red." },
   { q: "What is the Sun?", o: ["A star", "A planet", "A moon", "A comet"], a: 0, w: "The Sun is a star, the closest one to us." },
   { q: "In what year did American astronauts first walk on the Moon?", o: ["1969", "1959", "1979", "1989"], a: 0, w: "July 20, 1969: Apollo 11's Neil Armstrong and Buzz Aldrin walked on the Moon. 🇺🇸" },
   { q: "How long does Earth take to go around the Sun once?", o: ["1 year", "1 day", "1 month", "10 years"], a: 0, w: "One trip around the Sun is one year: about 365¼ days." },
   { q: "Which planet is famous for its bright rings of ice and rock?", o: ["Saturn", "Mars", "Mercury", "Venus"], a: 0, w: "Saturn's rings are mostly chunks of ice, some as small as dust and some as big as houses." }],
  [{ q: "Which planet has the shortest year?", o: ["Mercury", "Venus", "Earth", "Neptune"], a: 0, w: "Mercury orbits the Sun in only 88 days." },
   { q: "Gravity on the Moon is about 1/6 of Earth's. A student who weighs 90 lb on Earth weighs about… on the Moon.", o: ["15 lb", "45 lb", "90 lb", "540 lb"], a: 0, w: "90 ÷ 6 = 15 lb. Your mass is the same; the pull is weaker." },

/* =====================================================================
   Mission 2: Launch to orbit (Newton's cannon, real physics)
   ===================================================================== */
function missionRocket() {
  const GM = 3.986e14, Re = 6.371e6, H0 = 160e3;   // launch from 100 miles up, above the air
  let v0 = 6, ang = 0, rocket = null, trails = [], view = 1, best = null;
  const warp = 600;   // 1 second on screen = 10 minutes
  function launch() {
    const r = Re + H0, a = ang * Math.PI / 180;
    rocket = { x: 0, y: r, vx: v0 * 1000 * Math.cos(a), vy: v0 * 1000 * Math.sin(a), t: 0, th: 0, lastA: Math.PI / 2, state: "fly", path: [] };
    banner("");
  }
  function step(dt) {
    if (!rocket || rocket.state !== "fly") return;

      const r = Math.hypot(rocket.x, rocket.y), a = -GM / (r * r * r);
      rocket.vx += a * rocket.x * d; rocket.vy += a * rocket.y * d; rocket.x += rocket.vx * d; rocket.y += rocket.vy * d; rocket.t += d;
      const an = Math.atan2(rocket.y, rocket.x); let da = an - rocket.lastA; if (da > Math.PI) da -= TAU; if (da < -Math.PI) da += TAU; rocket.th += da; rocket.lastA = an;

      if (rr < Re) { rocket.state = "crash"; break; }
      if (rr > Re * 40) { rocket.state = "escape"; break; }
      if (Math.abs(rocket.th) >= TAU) { rocket.state = "orbit"; break; }
    }
    if (rocket.path.length === 0 || Math.hypot(rocket.x - rocket.path.at(-1)[0], rocket.y - rocket.path.at(-1)[1]) > 2e4) rocket.path.push([rocket.x, rocket.y]);
    if (rocket.state !== "fly") finish();
  }

    const s = rocket.state;
    trails.push({ path: rocket.path.slice(), c: s === "orbit" ? "#3ddc97" : s === "escape" ? "#6c9bff" : "#ff6b6b" }); if (trails.length > 5) trails.shift();
    const miles = Math.abs(rocket.th) * Re / 1609;
    if (s === "crash") banner(`💥 Fell back to Earth after ${fmt(miles)} miles. Faster!`);
    if (s === "escape") banner(`🌌 You escaped Earth's gravity! (Escape speed ≈ 11.2 km/s = 25,000 mph)`);
    if (s === "orbit") { banner(`🛰️ ORBIT! You circled Earth in ${fmt(rocket.t / 60)} minutes.`); if (!S.done.m2) { award("m2", "You reached orbit!"); panel(); } }
    if (s === "orbit") rocket.state = "orbit-keep";
  }
  function panel() {
    const b = band();
    $("panel").innerHTML = `<div class="kicker">Mission 2 of 6</div><h1>🚀 Launch to Orbit</h1>
      <p class="small muted">Isaac Newton imagined a giant cannon on a tall mountain. Fire slowly and the ball falls back. Fire fast enough and it falls <i>around</i> Earth forever: that's an orbit!</p>

  if (window.QR) { try { const q = QR.make("https://www.amonlines.com/", "M"), sz = 150, cell = sz / (q.size + 2), qx = Wc - 130 - sz, qy = Hc - 130 - sz - 40; x.fillStyle = "#fff"; x.fillRect(qx - 8, qy - 8, sz + 16, sz + 16); x.fillStyle = "#0b1d4a"; for (let i = 0; i < q.size; i++) for (let j = 0; j < q.size; j++) if (q.get(j, i)) x.fillRect(qx + (j + 1) * cell, qy + (i + 1) * cell, Math.ceil(cell), Math.ceil(cell)); x.fillStyle = "#c9d6f5"; x.font = "600 18px Inter, Arial"; x.fillText("Book a lesson", qx + sz / 2, qy + sz + 34); } catch {} }
  x.fillStyle = "#9fb0d6"; x.font = "600 22px Inter, Arial, sans-serif"; x.fillText(`${APP_URL.replace(/^https?:\/\//, "")}  ·  Math · Physics · Science · Python for Kids`, Wc / 2, Hc - 112);
  // preview size
  if (c.id === "certPrev") { c.style.width = "100%"; c.style.height = "auto"; }
}
function downloadCert() { const c = certCanvas(); const a = document.createElement("a"); a.download = `${(S.name || "space-cadet").replace(/[^\w-]+/g, "-")}-space-certificate.png`; a.href = c.toDataURL("image/png"); a.click(); }

/* confetti in red, white, blue and gold */
let confettiRaf = 0;
function confetti() {
  const c = document.createElement("canvas"); c.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:40"; c.width = innerWidth; c.height = innerHeight; document.body.appendChild(c);
  const x = c.getContext("2d"), cols = ["#B22234", "#ffffff", "#3C3B6E", "#f5c451", "#6c9bff"];
  const ps = Array.from({ length: 160 }, () => ({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .5, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, r: Math.random() * TAU, c: cols[Math.random() * cols.length | 0], s: 5 + Math.random() * 6 }));
  let n = 0; const step = () => { x.clearRect(0, 0, c.width, c.height); for (const p of ps) { p.x += p.vx; p.y += p.vy; p.r += .1; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); } if (++n < 260) confettiRaf = requestAnimationFrame(step); else c.remove(); };
  step();
}
function cancelConfetti() { cancelAnimationFrame(confettiRaf); }

(async () => {
  load();
  if (AM && AM.student) { S.name = S.name || AM.student.firstName; if (!S.mission && AM.student.grade >= 5) S.grade = Math.min(12, AM.student.grade); }
  raf = requestAnimationFrame(loop);
  if (PUB && !PUB.staff) {
    let st = { status: "new" }; try { st = await (await fetch("/api/public/space/status", { credentials: "same-origin" })).json(); } catch {}
    ST = st;
    if (st.status === "played") return S.finished ? showEnd() : welcome(true);
    if (st.status === "active" && S.mission) return S.finished ? showEnd() : goMission(S.mission);
  }
  if (S.finished && !(PUB && PUB.staff)) return showEnd();
  if (AM && AM.mode !== "student" && !AM.student) { S.name = S.name || "Preview"; }
  welcome(false);
})();
