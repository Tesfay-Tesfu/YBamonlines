<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="amt-banner" content="off">
<title>Whiteboard</title>
<style>
  :root { --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --panel:#ffffff; --accent:#2563eb; --accent-soft:#eff6ff; --deep:#002d5f; --brand:#e66414;
          --shadow:0 4px 18px rgba(15,23,42,.10), 0 1px 3px rgba(15,23,42,.08); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif; color:var(--ink); background:#f3f4f6; -webkit-user-select:none; user-select:none; }
  button, input, select { font:inherit; color:inherit; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; }
  /* top bar */
  #top { height:52px; flex:none; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; padding:0 10px; z-index:20; }
  #top .logo { width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--deep),var(--brand)); color:#fff; display:grid; place-items:center; font-weight:900; font-size:15px; flex:none; }
  #title { border:1px solid transparent; border-radius:8px; padding:5px 8px; font-weight:700; font-size:15px; width:min(280px,32vw); background:transparent; -webkit-user-select:text; user-select:text; }
  #title:hover { border-color:var(--line); } #title:focus { outline:none; border-color:var(--accent); background:#fff; }
  #who { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .grow { flex:1; }
  .ib { width:36px; height:36px; border:none; background:none; border-radius:9px; display:grid; place-items:center; cursor:pointer; color:#374151; flex:none; position:relative; }
  .ib:hover { background:#f3f4f6; } .ib.on { background:var(--accent-soft); color:var(--accent); } .ib:disabled { opacity:.35; cursor:default; background:none; }
  .ib svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .tb { border:1px solid var(--line); background:#fff; border-radius:9px; padding:6px 11px; cursor:pointer; font-weight:600; font-size:13.5px; white-space:nowrap; }
  .tb:hover { border-color:#cbd5e1; background:#f9fafb; } .tb.on { background:var(--accent); border-color:var(--accent); color:#fff; } .tb.danger { color:#b91c1c; }
  #people { display:flex; align-items:center; }
  #people .av { width:28px; height:28px; border-radius:50%; color:#fff; font-size:12px; font-weight:800; display:grid; place-items:center; border:2px solid #fff; margin-left:-6px; box-shadow:0 0 0 1px rgba(0,0,0,.05); }
  #status { font-size:12.5px; color:var(--muted); white-space:nowrap; min-width:70px; text-align:right; }
  #status.live::before { content:"●"; color:#16a34a; margin-right:4px; } #status.bad { color:#b45309; }
  .sep { width:1px; height:24px; background:var(--line); margin:0 2px; flex:none; }
  /* stage */
  #stage { position:relative; flex:1; overflow:hidden; touch-action:none; background:#fff; }
  #stage canvas { position:absolute; left:0; top:0; }
  #stage.c-pen, #stage.c-hl, #stage.c-line, #stage.c-arrow, #stage.c-darrow, #stage.c-rect, #stage.c-ellipse, #stage.c-tri, #stage.c-rtri, #stage.c-poly, #stage.c-angle, #stage.c-pt, #stage.c-axes, #stage.c-prot, #stage.c-ruler { cursor:crosshair; }
  #stage.c-hand { cursor:grab; } #stage.c-text { cursor:text; } #stage.c-eraser, #stage.c-laser { cursor:none; } #stage.panning { cursor:grabbing; }
  #ta { position:absolute; display:none; border:1.5px dashed var(--accent); background:rgba(255,255,255,.85); resize:none; outline:none; padding:2px 4px; margin:0; overflow:hidden; white-space:pre; line-height:1.25; font-family:"Segoe UI",system-ui,sans-serif; min-width:40px; -webkit-user-select:text; user-select:text; z-index:5; }
  /* floating panels */
  .float { position:absolute; background:var(--panel); border-radius:14px; box-shadow:var(--shadow); z-index:10; }
  #tools { left:10px; top:64px; padding:6px; display:flex; flex-direction:column; gap:2px; max-height:calc(100% - 128px); overflow-y:auto; scrollbar-width:none; }
  #tools .grp { display:grid; grid-template-columns:repeat(var(--cols,1),40px); gap:2px; padding:3px 0; border-bottom:1px solid #f1f2f4; } #tools .grp:last-child { border:none; }

  #tools .ib { width:40px; height:38px; } #tools .ib svg { width:21px; height:21px; }
  .tip { position:absolute; left:52px; background:#111827; color:#fff; font-size:12px; padding:4px 8px; border-radius:6px; white-space:nowrap; pointer-events:none; opacity:0; transition:opacity .12s; z-index:30; }
  #tools .ib:hover .tip { opacity:1; transition-delay:.35s; }
  .tip kbd { background:rgba(255,255,255,.18); border-radius:4px; padding:0 4px; margin-left:6px; font-family:inherit; font-size:11px; }
  #props { left:50%; transform:translateX(-50%); top:62px; padding:6px 10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; max-width:calc(100% - 140px); min-height:44px; }
  #props .lbl { font-size:12.5px; color:var(--muted); font-weight:600; }
  .sw { width:24px; height:24px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px #d1d5db; cursor:pointer; flex:none; padding:0; }
  .sw.on { box-shadow:0 0 0 2px var(--accent); transform:scale(1.08); }
  .swatches { display:flex; gap:5px; align-items:center; }
  input[type=color] { width:26px; height:26px; border:none; padding:0; background:none; cursor:pointer; }
  input[type=range] { width:110px; accent-color:var(--accent); }
  .dotprev { width:30px; height:30px; display:grid; place-items:center; } .dotprev i { display:block; border-radius:50%; background:#111; }
  .seg2 { display:inline-flex; background:#f3f4f6; border-radius:9px; padding:2px; }
  .seg2 button { border:none; background:none; padding:5px 10px; border-radius:7px; cursor:pointer; font-size:13px; font-weight:600; color:var(--muted); }
  .seg2 button.on { background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .sym { display:flex; flex-wrap:wrap; gap:2px; max-width:440px; }
  .sym button { border:1px solid var(--line); background:#fff; border-radius:6px; min-width:28px; height:28px; cursor:pointer; font-size:15px; padding:0 4px; }
  .sym button:hover { border-color:var(--accent); color:var(--accent); }
  #pagebar { right:10px; bottom:10px; padding:5px 6px; display:flex; align-items:center; gap:2px; }
  #pagebar .num { font-size:13px; font-weight:700; min-width:58px; text-align:center; }
  #pagebar select { border:1px solid var(--line); border-radius:8px; padding:5px 6px; font-size:13px; background:#fff; }
  #zoomPct { font-size:12.5px; font-weight:700; min-width:48px; border:none; background:none; cursor:pointer; border-radius:8px; height:32px; }
  #zoomPct:hover { background:#f3f4f6; }
  #follow { left:10px; bottom:10px; z-index:12; padding:8px 12px; display:none; align-items:center; gap:10px; font-size:13.5px; font-weight:600; }
  #readonly { left:10px; top:64px; padding:8px 12px; font-size:13px; font-weight:700; color:#92400e; background:#fffbeb; display:none; }
  /* drawer */
  #drawer { position:absolute; left:0; top:52px; bottom:0; width:320px; max-width:90vw; background:#fff; border-right:1px solid var(--line); box-shadow:var(--shadow); z-index:25; transform:translateX(-105%); transition:transform .18s; display:flex; flex-direction:column; }
  #drawer.open { transform:none; }
  #drawer h2 { font-size:15px; margin:14px 16px 8px; }
  #drawer .list { flex:1; overflow:auto; padding:0 8px 8px; }
  .bitem { display:flex; gap:10px; align-items:center; padding:9px 10px; border-radius:10px; cursor:pointer; }
  .bitem:hover { background:#f3f4f6; } .bitem.on { background:var(--accent-soft); }
  .bitem .ic { width:36px; height:28px; border-radius:6px; border:1px solid var(--line); background:repeating-linear-gradient(0deg,#fff 0 7px,#eef2f7 7px 8px),#fff; flex:none; }
  .bitem b { display:block; font-size:14px; } .bitem span { font-size:12px; color:var(--muted); }
  .livedot { color:#16a34a; font-weight:800; }
  #drawer .foot { padding:10px 12px; border-top:1px solid var(--line); display:flex; gap:6px; flex-wrap:wrap; }
  /* modal + toast */
  #modal { position:fixed; inset:0; background:rgba(15,23,42,.35); display:none; place-items:center; z-index:50; }
  #modal .box { background:#fff; border-radius:16px; padding:18px 20px; width:min(420px,92vw); box-shadow:var(--shadow); }
  #modal h3 { margin:0 0 8px; } #modal p { margin:0 0 12px; color:#374151; font-size:14.5px; }
  #modal .row { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; flex-wrap:wrap; }
  #modal input[type=text], #modal select { width:100%; border:1px solid #d1d5db; border-radius:9px; padding:8px 10px; margin:4px 0 8px; -webkit-user-select:text; user-select:text; }
  #toast { position:fixed; left:50%; bottom:70px; transform:translateX(-50%); background:#111827; color:#fff; padding:9px 14px; border-radius:10px; font-size:13.5px; z-index:60; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:.95; }
  #menu { position:absolute; display:none; z-index:40; padding:6px; min-width:200px; }
  #menu button { display:block; width:100%; text-align:left; border:none; background:none; padding:8px 10px; border-radius:8px; cursor:pointer; font-size:14px; }
  #menu button:hover { background:#f3f4f6; }
  #empty { position:absolute; inset:0; display:none; place-items:center; text-align:center; color:var(--muted); z-index:15; background:#fff; }
  .pgroup { display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
  .ib .more { position:absolute; right:3px; bottom:3px; width:0; height:0; border-left:4px solid transparent; border-bottom:4px solid currentColor; opacity:.55; }
  #pop { position:absolute; display:none; z-index:40; padding:8px; }
  #pop .gt { font-size:12px; font-weight:700; color:var(--muted); margin:0 4px 6px; }
  #pop .pgrid { display:grid; grid-template-columns:repeat(4, 64px); gap:4px; }
  #pop .pgrid button { border:none; background:none; border-radius:10px; padding:6px 2px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; color:#374151; line-height:1.15; text-align:center; }
  #pop .pgrid button.on { background:var(--accent-soft); color:var(--accent); }
  #pop .pgrid svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .styledot { width:22px; height:22px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1.5px #9ca3af; display:block; }
  #bExport .ico { display:none; }
  @media (hover:none) { .tip { display:none; } }
  /* ---------- phones and small windows ---------- */
  body.compact #top { height:48px; padding:0 4px; gap:2px; }
  body.compact #top .logo, body.compact #who, body.compact #status, body.compact .sep { display:none; }
  body.compact #title { width:auto; flex:1; min-width:60px; font-size:14px; padding:4px 6px; }
  body.compact #top .grow { display:none; }
  body.compact #people .av { width:24px; height:24px; font-size:10px; }
  body.compact #people .av:nth-child(n+3) { display:none; }
  body.compact #bLead { padding:6px 8px; } body.compact #bLead .lt { display:none; }
  body.compact #bExport { border:none; padding:0; width:36px; height:36px; display:grid; place-items:center; background:none; }
  body.compact #bExport .lt { display:none; } body.compact #bExport .ico { display:block; }
  body.compact #tools { left:50%; transform:translateX(-50%); top:auto; bottom:8px; flex-direction:row; max-width:calc(100% - 12px); max-height:none; overflow-x:auto; overflow-y:hidden; padding:4px; gap:0; border-radius:16px; }
  body.compact #tools { width:min(440px, calc(100% - 12px)); }
  body.compact #tools .ib { width:auto; min-width:32px; height:40px; flex:1 1 0; }
  body.compact #props { left:6px; right:6px; transform:none; top:auto; bottom:64px; max-width:none; flex-wrap:nowrap; overflow-x:auto; padding:6px 8px; min-height:0; display:none; scrollbar-width:none; }
  body.compact #props.show { display:flex; }
  body.compact #props .sym { flex-wrap:nowrap; max-width:none; }
  body.compact #pagebar { top:8px; bottom:auto; right:8px; padding:2px 3px; }
  body.compact #pagebar .wide { display:none; }
  body.compact #pagebar .ib { width:34px; height:34px; }
  body.compact #pagebar .num { min-width:44px; font-size:12.5px; }
  body.compact #follow { top:8px; bottom:auto; left:8px; padding:5px 8px; font-size:12.5px; }
  body.compact #readonly { top:8px; left:8px; }
  body.compact #toast { bottom:120px; }
  body.compact #menu { max-width:calc(100% - 16px); }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="ib" id="bBoards" title="Boards"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="logo">AM</div>
    <input id="title" value="Whiteboard" aria-label="Board name" maxlength="80">
    <span id="who"></span>
    <div class="grow"></div>
    <div id="people"></div>
    <span id="status"></span>
    <div class="sep"></div>
    <button class="ib" id="bUndo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="ib" id="bRedo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <span id="bLeadWrap"><button class="tb" id="bLead" title="Everyone follows your page and view" hidden>📣<span class="lt"> Lead</span></button></span>
    <button class="tb" id="bExport" title="Export"><span class="lt">Export ▾</span><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas><canvas id="ov"></canvas>
    <textarea id="ta" spellcheck="false"></textarea>
    <div class="float" id="tools"></div>
    <div class="float" id="props"></div>
    <div class="float" id="readonly">👀 View only</div>
    <div class="float" id="pagebar">
      <button class="ib" id="pPrev" title="Previous page (PageUp)"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <span class="num" id="pNum">1 / 1</span>
      <button class="ib" id="pNext" title="Next page (PageDown)"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
      <button class="ib" id="pAdd" title="Add a page"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ib" id="pMore" title="Page options"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
      <div class="sep"></div>
      <select id="pBg" class="wide" title="Paper"><option value="grid">Grid</option><option value="graph">Graph paper</option><option value="dots">Dots</option><option value="lined">Lined</option><option value="plain">Plain</option></select>
      <button class="ib wide" id="bSnap" title="Snap shapes to the grid"><svg viewBox="0 0 24 24"><path d="M6 15V9a6 6 0 0 1 12 0v6"/><path d="M6 15h4v-3H6M14 12h4v3h-4"/><path d="M6 19h4M14 19h4"/></svg></button>
      <div class="sep"></div>
      <button class="ib wide" id="zOut" title="Zoom out (Ctrl −)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="zoomPct" class="wide" title="Back to 100%">100%</button>
      <button class="ib wide" id="zIn" title="Zoom in (Ctrl +)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ib wide" id="zFit" title="Fit the page (Ctrl 0)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="float" id="follow"><span id="followTxt"></span><button class="tb" id="followBtn">Stop following</button></div>
    <div class="float" id="menu"></div>
    <div class="float" id="pop"></div>
    <div id="empty"><div><h2>No boards yet</h2><p>Your tutor will add a board for you.</p></div></div>
  </div>
  <aside id="drawer"><h2 id="drawerTitle">Boards</h2><div class="list" id="blist"></div><div class="foot" id="dfoot"></div></aside>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<input type="file" id="fileImg" accept="image/*" hidden>

<script>
"use strict";
/* =====================================================================
   Platform
   ===================================================================== */
const AM = window.AMT || null;
const MODE = AM ? AM.mode : "standalone";
const LIVE = !!AM && MODE !== "standalone";
const VIEWER = AM && AM.viewer ? AM.viewer : { id: 0, role: "student", name: "You" };
const STUDENT = AM ? AM.student : null;
const ADULT = VIEWER.role !== "student";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const rid = () => Math.random().toString(36).slice(2, 10) + (++rid.n).toString(36);
rid.n = 0;
const CID = rid() + rid();
const LS = (() => { try { return window.localStorage; } catch (e) { return null; } })(); // device prefs only
const pref = (k, d) => { try { const v = JSON.parse(LS.getItem("wb-" + k)); return v == null ? d : v; } catch (e) { return d; } };
const setPref = (k, v) => { try { LS.setItem("wb-" + k, JSON.stringify(v)); } catch (e) {} };
async function api(method, path, body) {
  const r = await fetch(path, { method, credentials: "same-origin", headers: Object.assign({ "X-AMT": "1" }, body ? { "Content-Type": "application/json" } : {}), body: body ? JSON.stringify(body) : undefined });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error(j.error || `Request failed (${r.status})`); e.status = r.status; throw e; }
  return j;
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600); }
function modal(html, wire) {
  $("mbox").innerHTML = html; $("modal").style.display = "grid";
  const close = () => { $("modal").style.display = "none"; $("mbox").innerHTML = ""; };
  $("mbox").querySelectorAll("[data-close]").forEach(b => b.onclick = close);
  if (wire) wire($("mbox"), close);
  const f = $("mbox").querySelector("input,select"); if (f) setTimeout(() => f.focus(), 30);
  return close;
}
const confirmBox = (title, text, ok = "OK", danger = false) => new Promise(res => modal(`<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="row"><button class="tb" data-close>Cancel</button><button class="tb ${danger ? "danger" : "on"}" id="mOk">${esc(ok)}</button></div>`,
  (m, close) => { m.querySelector("[data-close]").addEventListener("click", () => res(false)); m.querySelector("#mOk").onclick = () => { close(); res(true); }; }));

/* =====================================================================
   Document model (same rules as the server)
   ===================================================================== */
const GRID = 32;
const SNAP = { grid: 32, dots: 32, graph: 8, lined: 16, plain: 16 };
const blankPage = (bg = "grid") => ({ id: rid(), bg, els: [] });
let DOC = { pages: [blankPage()] };
let PAGE = DOC.pages[0].id;
let CAN_EDIT = true;
const page = () => DOC.pages.find(p => p.id === PAGE) || DOC.pages[0];
const pageIdx = () => Math.max(0, DOC.pages.findIndex(p => p.id === page().id));
const pageById = id => DOC.pages.find(p => p.id === id);
const clone = o => JSON.parse(JSON.stringify(o));

function applyOp(op) {
  const P = DOC.pages;
  switch (op.o) {
    case "add": { const p = pageById(op.p); if (!p) return; const i = p.els.findIndex(x => x.id === op.e.id); if (i >= 0) p.els[i] = op.e; else if (Number.isInteger(op.at) && op.at >= 0 && op.at <= p.els.length) p.els.splice(op.at, 0, op.e); else p.els.push(op.e); if (op.e.t === "img") imgFor(op.e); return; }
    case "upd": { const p = pageById(op.p); if (!p) return; const i = p.els.findIndex(x => x.id === op.e.id); if (i >= 0) p.els[i] = op.e; return; }
    case "del": { const p = pageById(op.p); if (!p) return; const s = new Set(op.ids); p.els = p.els.filter(x => !s.has(x.id)); return; }
    case "order": { const p = pageById(op.p); if (!p) return; const s = new Set(op.ids); const m = p.els.filter(x => s.has(x.id)), r = p.els.filter(x => !s.has(x.id)); p.els = op.dir === "back" ? [...m, ...r] : [...r, ...m]; return; }
    case "addPage": { if (P.some(p => p.id === op.page.id)) return; const at = Number.isInteger(op.at) ? Math.max(0, Math.min(P.length, op.at)) : P.length; P.splice(at, 0, clone(op.page)); op.page.els.forEach(e => e.t === "img" && imgFor(e)); return; }
    case "delPage": { if (P.length <= 1) return; const i = P.findIndex(p => p.id === op.p); if (i >= 0) P.splice(i, 1); if (!pageById(PAGE)) PAGE = P[Math.min(i, P.length - 1)].id; return; }
    case "pageBg": { const p = pageById(op.p); if (p) p.bg = op.bg; return; }
    case "clear": { const p = pageById(op.p); if (p) p.els = []; return; }
  }
}

/* ---------- history (undo / redo) ---------- */
let UNDO = [], REDO = [];
function commit(redo, undo, { record = true } = {}) {

  ["Duplicate this page", () => { const pg = Object.assign(clone(page()), { id: rid() }); pg.els.forEach(x => x.id = rid()); const at = pageIdx() + 1; commit([{ o: "addPage", page: pg, at }], [{ o: "delPage", p: pg.id }]); PAGE = pg.id; updatePageBar(); dirtyBase(); }],

  ["Delete this page", async () => { if (DOC.pages.length <= 1) return toast("A board needs at least one page."); if (await confirmBox("Delete this page?", "You can undo it.", "Delete page", true)) { const pg = clone(page()), at = pageIdx(); commit([{ o: "delPage", p: pg.id }], [{ o: "addPage", page: pg, at }]); updatePageBar(); fitPage(true); } }],
], COMPACT ? "down" : "up");
$("zIn").onclick = () => zoomAt(W / 2, H / 2, 1.25); $("zOut").onclick = () => zoomAt(W / 2, H / 2, 0.8); $("zFit").onclick = () => fitPage();
$("zoomPct").onclick = () => zoomAt(W / 2, H / 2, 1 / cam.z);
$("bUndo").onclick = undo; $("bRedo").onclick = redo;

/* ---------- menus ---------- */
function openMenu(anchor, items, dir = "down") {
  const m = $("menu"); m.innerHTML = items.map(([t], i) => `<button data-i="${i}">${esc(t)}</button>`).join(""); m.style.display = "block";
  const ar = anchor.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(ar.left - sr.left, sr.width - m.offsetWidth - 8)) + "px";
  m.style.top = (dir === "up" ? ar.top - sr.top - m.offsetHeight - 6 : Math.max(8, ar.bottom - sr.top + 6)) + "px";
  m.querySelectorAll("button").forEach(b => b.onclick = () => { closeMenu(); items[+b.dataset.i][1](); });
  setTimeout(() => document.addEventListener("pointerdown", closeOnOutside), 0);
}
function closeOnOutside(e) { if (!$("menu").contains(e.target)) closeMenu(); }
function closeMenu() { $("menu").style.display = "none"; document.removeEventListener("pointerdown", closeOnOutside); }

/* =====================================================================
   Export (PNG and PDF)
   ===================================================================== */
function renderPageTo(pg, scale, maxDim = 4000, padPx = 40) {
  const b = contentBox(pg.els) || [0, 0, 800, 600]; const x0 = b[0] - padPx, y0 = b[1] - padPx, w = b[2] - b[0] + padPx * 2, h = b[3] - b[1] + padPx * 2;
  const s = Math.min(scale, maxDim / Math.max(w, h)); const c = document.createElement("canvas"); c.width = Math.ceil(w * s); c.height = Math.ceil(h * s);
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
  const saved = cam; cam = { x: x0, y: y0, z: s }; g.setTransform(s, 0, 0, s, -x0 * s, -y0 * s);
  drawBg(g, pg.bg, [x0, y0, x0 + w, y0 + h]); pg.els.forEach(e => drawEl(g, e, s)); cam = saved;
  return c;
}
const fileBase = () => (($("title").value || "whiteboard").replace(/[^\w\- ]+/g, "").trim() || "whiteboard").replace(/\s+/g, "-");
function download(url, name) { const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 100); }
function exportPNG() { const c = renderPageTo(page(), 2); download(c.toDataURL("image/png"), `${fileBase()}-page${pageIdx() + 1}.png`); }
function exportPDF() {
  const enc = new TextEncoder(), parts = [], offsets = []; let len = 0;
  const push = d => { const b = typeof d === "string" ? enc.encode(d) : d; parts.push(b); len += b.length; };
  const obj = (n, body) => { offsets[n] = len; push(`${n} 0 obj\n`); body(); push("\nendobj\n"); };
  const imgs = DOC.pages.map(pg => { const c = renderPageTo(pg, 1.5, 2400); const bin = atob(c.toDataURL("image/jpeg", 0.9).split(",")[1]); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return { u, w: c.width, h: c.height }; });
  const N = imgs.length; push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  obj(1, () => push("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2, () => push(`<< /Type /Pages /Count ${N} /Kids [${imgs.map((_, i) => `${3 + i * 3} 0 R`).join(" ")}] >>`));
  imgs.forEach((im, i) => {
    const pw = 842, ph = Math.round(842 * im.h / im.w), n = 3 + i * 3, content = `q ${pw} 0 0 ${ph} 0 0 cm /Im${i} Do Q`;
    obj(n, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im${i} ${n + 2} 0 R >> >> /Contents ${n + 1} 0 R >>`));
    obj(n + 1, () => { push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`); });
    obj(n + 2, () => { push(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.u.length} >>\nstream\n`); push(im.u); push("\nendstream"); });
  });
  const xref = len, count = 3 + N * 3;
  push(`xref\n0 ${count}\n0000000000 65535 f \n${Array.from({ length: count - 1 }, (_, i) => String(offsets[i + 1]).padStart(10, "0") + " 00000 n \n").join("")}trailer\n<< /Size ${count} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  const blob = new Blob(parts, { type: "application/pdf" }); const url = URL.createObjectURL(blob); download(url, `${fileBase()}.pdf`); setTimeout(() => URL.revokeObjectURL(url), 5000);
}
$("bExport").onclick = e => openMenu(e.currentTarget, [["Download this page as a picture (PNG)", exportPNG], ["Download all pages as a PDF", exportPDF]]);

/* =====================================================================
   Boards (list, create, rename, delete) and lead / follow
   ===================================================================== */
let BOARDS = [], LIST_CAN_EDIT = true;
const lastKey = () => "last-" + (STUDENT ? "s" + STUDENT.id : "u" + VIEWER.id);
const ago = d => { const s = (Date.now() - new Date(d)) / 1000; return s < 60 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : new Date(d).toLocaleDateString(); };
async function loadBoards(openFirst = false) {
  const q = STUDENT ? `?student=${STUDENT.id}` : "";
  const r = await api("GET", "/api/boards" + q); BOARDS = r.boards; LIST_CAN_EDIT = r.canEdit;
  if (!BOARDS.length && LIST_CAN_EDIT) { const c = await api("POST", "/api/boards", { student: STUDENT ? STUDENT.id : undefined, title: STUDENT ? `${STUDENT.firstName}'s board` : "Lesson board" }); BOARDS = [Object.assign(c.board, { pages: 1, updated_at: new Date().toISOString() })]; }
  renderDrawer();
  if (!BOARDS.length) { $("empty").style.display = "grid"; return; }
  $("empty").style.display = "none";
  if (openFirst || !BOARD) { const last = pref(lastKey(), null); openBoard((BOARDS.find(b => b.id === last) || BOARDS[0]).id); }
}
function renderDrawer() {
  $("drawerTitle").textContent = STUDENT ? `${STUDENT.firstName}'s boards` : "My lesson boards";
  $("blist").innerHTML = BOARDS.map(b => `<div class="bitem${BOARD && b.id === BOARD.id ? " on" : ""}" data-id="${b.id}"><div class="ic"></div><div><b>${esc(b.title)}</b><span>${b.tutor_name && b.tutor_key !== VIEWER.id ? `${esc(b.tutor_subject ? b.tutor_subject + " · " + b.tutor_name.split(" ")[0] : b.tutor_name)} · ` : ""}${b.pages || 1} page${(b.pages || 1) === 1 ? "" : "s"} · ${ago(b.updated_at)}${b.live ? ` · <span class="livedot">● ${b.live} here</span>` : ""}</span></div></div>`).join("") || '<p style="padding:10px;color:#6b7280">No boards yet.</p>';
  $("blist").querySelectorAll(".bitem").forEach(d => d.onclick = () => { openBoard(+d.dataset.id); $("drawer").classList.remove("open"); });
  $("dfoot").innerHTML = LIST_CAN_EDIT ? `<button class="tb on" id="dNew">+ New board</button>${STUDENT && ADULT ? '<button class="tb" id="dCopy">Copy a lesson board</button>' : ""}${BOARD ? '<button class="tb danger" id="dDel">Delete this board</button>' : ""}` : "";
  if ($("dNew")) $("dNew").onclick = newBoardDialog;
  if ($("dCopy")) $("dCopy").onclick = copyBoardDialog;
  if ($("dDel")) $("dDel").onclick = async () => { if (!(await confirmBox(`Delete “${BOARD.title}”?`, "The board and all its pages are deleted for everyone. This can’t be undone.", "Delete board", true))) return; try { await api("DELETE", `/api/boards/${BOARD.id}`); toast("Board deleted"); BOARD = null; if (ES) ES.close(); ES = null; await loadBoards(true); } catch (e) { toast(e.message); } };
}
function newBoardDialog() {
  modal(`<h3>New board</h3><label>Name<input type="text" id="nbName" maxlength="80" placeholder="e.g. Fractions – Oct 23"></label><label>Paper<select id="nbBg"><option value="grid">Grid</option><option value="graph">Graph paper</option><option value="dots">Dots</option><option value="lined">Lined</option><option value="plain">Plain</option></select></label><div class="row"><button class="tb" data-close>Cancel</button><button class="tb on" id="nbGo">Create</button></div>`, (m, close) => {
    const go = async () => { try { const r = await api("POST", "/api/boards", { student: STUDENT ? STUDENT.id : undefined, title: m.querySelector("#nbName").value, bg: m.querySelector("#nbBg").value }); close(); $("drawer").classList.remove("open"); await loadBoards(); openBoard(r.board.id); } catch (e) { toast(e.message); } };
    m.querySelector("#nbGo").onclick = go; m.querySelector("#nbName").onkeydown = e => { if (e.key === "Enter") go(); };
  });
}
async function copyBoardDialog() {
  let mine; try { mine = (await api("GET", "/api/boards")).boards; } catch (e) { return toast(e.message); }
  if (!mine.length) return modal(`<h3>No lesson boards yet</h3><p>Open the Whiteboard from <b>Tools</b> (without choosing a student) to prepare lesson boards. Then you can copy them to any student here.</p><div class="row"><button class="tb on" data-close>OK</button></div>`);
  modal(`<h3>Copy a lesson board</h3><p>Pick one of your prepared boards. ${esc(STUDENT.firstName)} gets their own copy.</p><select id="cbSel">${mine.map(b => `<option value="${b.id}">${esc(b.title)} (${b.pages} page${b.pages === 1 ? "" : "s"})</option>`).join("")}</select><div class="row"><button class="tb" data-close>Cancel</button><button class="tb on" id="cbGo">Copy</button></div>`, (m, close) => {
    m.querySelector("#cbGo").onclick = async () => { const sel = m.querySelector("#cbSel"); try { const r = await api("POST", "/api/boards", { student: STUDENT.id, copyFrom: +sel.value, title: sel.options[sel.selectedIndex].text.replace(/ \(\d+ pages?\)$/, "") }); close(); $("drawer").classList.remove("open"); await loadBoards(); openBoard(r.board.id); } catch (e) { toast(e.message); } };
  });
}
function openBoard(id) {
  if (LEADING) toggleLead();
  finishText(); clearSel(); cancelGesture();
  if (ES) { ES.close(); ES = null; }
  OUTBOX = []; INFLIGHT = null; UNDO = []; REDO = []; PEOPLE = []; CURSORS.clear(); REMOTE_DRAFTS.clear(); stopFollow(true); FOLLOW_OFF = false;
  const b = BOARDS.find(x => x.id === id) || { id, title: "" };
  BOARD = { id, title: b.title }; $("title").value = b.title; setPref(lastKey(), id); snapFitDone = false;
  renderDrawer(); connect(); afterChange();
}
$("bBoards").onclick = async () => { const d = $("drawer"); d.classList.toggle("open"); if (d.classList.contains("open") && LIVE) { try { const r = await api("GET", "/api/boards" + (STUDENT ? `?student=${STUDENT.id}` : "")); BOARDS = r.boards; renderDrawer(); } catch (e) {} } };
$("title").addEventListener("change", async () => {
  const t = $("title").value.trim(); if (!t) { $("title").value = BOARD ? BOARD.title : "Whiteboard"; return; }
  if (!LIVE) { setPref("local-title", t); return; }
  try { await api("PATCH", `/api/boards/${BOARD.id}`, { title: t }); BOARD.title = t; const b = BOARDS.find(x => x.id === BOARD.id); if (b) b.title = t; renderDrawer(); } catch (e) { toast(e.message); $("title").value = BOARD.title; }
});
$("title").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
function toggleLead() {
  LEADING = !LEADING; $("bLead").classList.toggle("on", LEADING); $("bLead").innerHTML = `📣<span class="lt"> ${LEADING ? "Leading" : "Lead"}</span>`;
  live({ k: "lead", on: LEADING }); if (LEADING) { sendView(); toast("Everyone now follows your page and view."); }
}
$("bLead").onclick = toggleLead;
$("followBtn").onclick = () => stopFollow();

function applyEditMode() {
  $("tools").style.display = CAN_EDIT ? "flex" : "none";
  $("readonly").style.display = CAN_EDIT ? "none" : "block";
  $("title").readOnly = !CAN_EDIT;
  if (!CAN_EDIT) setTool("hand"); else buildProps();
  updatePageBar();
}

/* =====================================================================
   Standalone (opened as a plain file): one board saved in this browser
   ===================================================================== */
let saveTimer = null;
function saveLocal() { clearTimeout(saveTimer); saveTimer = setTimeout(() => { try { LS.setItem("wb-local-doc", JSON.stringify(DOC)); } catch (e) { toast("This browser could not save the board (too large?)."); } }, 600); }

/* =====================================================================
   Boot
   ===================================================================== */
window.addEventListener("resize", resize);
new ResizeObserver(resize).observe(stage);
buildToolbar(); resize();
requestAnimationFrame(frame);
(async function boot() {
  if (STUDENT) $("who").textContent = ADULT ? `· ${STUDENT.name}` : "";
  if (!LIVE) {
    try { const d = JSON.parse(LS.getItem("wb-local-doc")); if (d && d.pages && d.pages.length) DOC = d; } catch (e) {}
    DOC.pages.forEach(p => p.els.forEach(e => e.t === "img" && imgFor(e)));
    PAGE = DOC.pages[0].id; $("title").value = pref("local-title", "Whiteboard"); $("bBoards").style.display = "none"; setStatus("Saved on this device");
    setTool("pen"); afterChange(); fitPage(true); return;
  }
  setTool("pen");
  try { await loadBoards(true); } catch (e) { toast(e.message); setStatus("Not available", "bad"); $("empty").innerHTML = `<div><h2>Whiteboard not available</h2><p>${esc(e.message)}</p></div>`; $("empty").style.display = "grid"; }
})();
</script>
</body>
