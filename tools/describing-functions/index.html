function cleanNum(v) {

}
function checkNum(v, target, msg) {

}
function checkNums(v, want) {

  const got = (r.pts ? r.pts.map(p => p[0]) : r.nums || []).slice().sort((a, b) => a - b), w = want.slice().sort((a, b) => a - b);
  if (got.length !== w.length) return { ok: false, msg: got.length < w.length ? `There ${w.length === 2 ? "are two answers" : "are more answers"}.` : "" };

function checkFn(v, target, letter = "x", xs = [-3, -1, 0, 1, 2, 3, 5, 7]) {

  if (!s) return { ok: false, invalid: true, msg: "Type an expression." };
  if (letter !== "x" && letter !== "n" && letter !== "t") s = s.replace(new RegExp(`(?<![a-z])${letter}(?![a-z])`, "gi"), "x");

const plainText = h => { const d = document.createElement("div"); d.innerHTML = String(h).replace(/<\/t[dh]>\s*<\/tr>/gi, " ;</td></tr>").replace(/<\/t[dh]>/gi, " </td>").replace(/<br\s*\/?>|<\/li>|<\/div>/gi, " ; "); return d.textContent.replace(/\s+/g, " ").replace(/(\s*[|;]\s*)+$/, "").trim(); };

function mountQuestion(root, Q, { mode, lesson, onFinish, chartHost }) {
  let tries = 0, done = false, usedHelp = false; const t0 = performance.now(); const maxTries = mode === "test" || (Q.input === "choice" && Q.choices.length <= 2) ? 1 : 2;
  const sec = secOf(lesson);
  root.innerHTML = `<div class="muted">${sec.icon} Lesson ${lesson} · ${L[lesson].title}</div><div class="q">${Q.q}</div><div class="qa"></div><div class="fb" aria-live="polite"></div><div class="work"></div>`;
  const qa = root.querySelector(".qa"), fb = root.querySelector(".fb"), work = root.querySelector(".work");
  let chart = null;
  if (chartHost) {
    chartHost.innerHTML = Q.chart ? `<canvas class="chart"></canvas>` : "";

    if (Q.chart) { chart = newChart(chartHost.querySelector("canvas"), Q.chart); chart.layers = c => { if (Q.draw && !(done && Q.reveal)) Q.draw(c); if (done && Q.reveal) Q.reveal(c); else if (!Q.draw && done && Q.reveal) Q.reveal(c); }; chart.render(); }
  }
  const getVal = () => (Q.input === "multi" ? [...qa.querySelectorAll("input[type=checkbox]")].map((b, i) => (b.checked ? i : -1)).filter(i => i >= 0) : qa.querySelector("input[type=text]").value);
  if (Q.input === "choice") {
    qa.innerHTML = `<div class="ansrow" style="flex-direction:column;align-items:stretch">${Q.choices.map(c => `<button class="btn choice" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
    qa.querySelectorAll(".choice").forEach(b => b.onclick = () => submit(b.dataset.v, b));
  } else if (Q.input === "multi") {
    qa.innerHTML = `<div class="multi">${Q.choicesMulti.map((c, i) => `<label><input type="checkbox" value="${i}"><span>${esc(c)}</span></label>`).join("")}</div><div class="ansrow"><button class="btn primary chk">${mode === "test" ? "Save answer" : "Check"}</button></div>`;
    qa.querySelector(".chk").onclick = () => submit(getVal());
  } else {
    const keys = KEYS[Q.input] || [];
    qa.innerHTML = `<div class="ansrow"><input type="text" placeholder="${esc(Q.ph || "Your answer")}" autocomplete="off" spellcheck="false" autocapitalize="off"><button class="btn primary chk">${mode === "test" ? "Save answer" : "Check"}</button></div>
      ${keys.length ? `<div class="keys">${keys.map(k => `<button data-ins="${esc(k)}">${esc(k.trim())}</button>`).join("")}</div>` : ""}`;
    const inp = qa.querySelector("input");
    qa.querySelector(".chk").onclick = () => submit(inp.value);
    inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); if (!done) submit(inp.value); else if (onFinish.next) onFinish.next(); } };
    qa.querySelectorAll(".keys button").forEach(b => b.onclick = e => { e.preventDefault(); const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? s; inp.value = inp.value.slice(0, s) + b.dataset.ins + inp.value.slice(en); inp.focus(); const p = s + b.dataset.ins.length; inp.setSelectionRange(p, p); });
    if (window.innerWidth > 900) setTimeout(() => inp.focus({ preventScroll: true }), 40);
  }
  const record = (resp, ok, label) => {
    if (!AM) return;
    AM.attempt({ question: plainText(Q.q).slice(0, 290), response: String(resp).slice(0, 190), answer: plainText(Q.ansPlain || Q.ans).slice(0, 190), correct: ok, ms: performance.now() - t0,
      topic: `L${lesson} · ${L[lesson].title}`, mode: label, session: mode === "test" ? TEST.id : undefined, meta: { lesson, section: sec.id, kind: Q.input, test: mode === "test" ? TEST.id : null } });
  };
  const showSteps = () => { const s = Q.steps || []; if (s.length) work.innerHTML = `<ol class="steps">${s.map(x => `<li>${x}</li>`).join("")}</ol>`; };

    if (done) return;
    if (Q.input === "multi" ? !v.length : !String(v).trim()) { fb.className = "fb info"; fb.textContent = Q.input === "multi" ? "Select at least one statement." : "Type an answer first."; return; }

    }

    else if (tries < maxTries) { usedHelp = true; fb.className = "fb badc"; fb.innerHTML = `Not quite. ${r.msg || ""} Try once more. <div class="muted" style="font-weight:600">💡 ${Q.hint}</div>`; return; }
    else { done = true; fb.className = "fb badc"; fb.innerHTML = `${r.msg ? r.msg + " " : ""}The answer is <span class="eq">${Q.ans}</span>.`; }
    showSteps(); if (chart) chart.render();

  }
  return {
    hint() { if (done) return; usedHelp = true; fb.className = "fb info"; fb.innerHTML = `💡 ${Q.hint}`; },
    reveal() { if (done) { showSteps(); return; } record("(showed the steps)", false, "showed answer"); done = true; fb.className = "fb info"; fb.innerHTML = `The answer is <span class="eq">${Q.ans}</span>.`; showSteps(); if (chart) chart.render(); onFinish({ ok: false, firstTry: false, Q, lesson }); },
    get done() { return done; },
  };
}

  document.documentElement.style.setProperty("--c", S.color);
  document.documentElement.style.setProperty("--soft", S.color + "14");
  $("lesson").innerHTML = `<div class="lhead" style="background:linear-gradient(120deg, ${S.color}, ${S.color}cc)"><div class="n">${n}</div><div><div class="s">${S.icon} ${S.name}</div><h2>${D.title}</h2></div><div class="grow"></div>
      ${n > 1 ? `<button class="btn small" id="lPrev">‹ Lesson ${n - 1}</button>` : ""}${n < 19 ? `<button class="btn small" id="lNext">Lesson ${n + 1} ›</button>` : ""}</div>
    <div class="seg" id="lTabs"><button data-t="learn">📖 Learn</button><button data-t="explore">🔍 Explore</button><button data-t="practice">✏️ Practice</button></div><div id="lBody"></div>`;
  if ($("lPrev")) $("lPrev").onclick = () => openLesson(n - 1, LV.tab);
  if ($("lNext")) $("lNext").onclick = () => openLesson(n + 1, LV.tab);
  document.querySelectorAll("#lTabs button").forEach(b => { b.classList.toggle("on", b.dataset.t === LV.tab); b.onclick = () => { LV.tab = b.dataset.t; renderLesson(); }; });
  const body = $("lBody");
  if (LV.tab === "learn") {
    body.innerHTML = `<div class="grid2"><div class="card"><h3>Key ideas</h3><ul class="keylist">${D.key.map(k => `<li>${k}</li>`).join("")}</ul></div>
      <div class="stack"><div class="card"><h3>Example</h3><div class="example">${D.example}</div></div><div class="card"><h3>Words to know</h3><div class="vocab">${D.vocab.map(([a, b]) => `<div><b>${a}</b><br><span class="muted">${b}</span></div>`).join("")}</div></div>
      <div class="row"><button class="btn primary big" id="lGoEx">🔍 Explore it</button><button class="btn big" id="lGoPr">✏️ Practice</button></div></div></div>`;
    $("lGoEx").onclick = () => { LV.tab = "explore"; renderLesson(); }; $("lGoPr").onclick = () => { LV.tab = "practice"; renderLesson(); };
  } else if (LV.tab === "explore") { EX[n](body); }
  else {
    body.innerHTML = `<div class="grid2"><div class="card"><div id="pq"></div><div class="row" style="margin-top:12px"><button class="btn" id="pHint">💡 Hint</button><button class="btn" id="pSteps">👣 Show steps</button><span style="flex:1"></span><button class="btn primary" id="pNext">Next question ›</button></div></div>
      <div class="stack"><div class="card" id="pChart" hidden></div><div class="card"><h3>This lesson</h3><div id="pStat"></div></div></div></div>`;
    $("pHint").onclick = () => LV.runner && LV.runner.hint(); $("pSteps").onclick = () => LV.runner && LV.runner.reveal(); $("pNext").onclick = nextPractice;
    nextPractice();
  }
}
function lessonStatHTML(n) {
  const s = stat(n), r = s.recent.slice(-5);
  return `<div class="row">${[0, 1, 2, 3, 4].map(i => `<span style="width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-weight:900;background:${r[i] === 1 ? "#dcfce7" : r[i] === 0 ? "#fee2e2" : "#f1f5f9"};color:${r[i] === 1 ? "#15803d" : r[i] === 0 ? "#b91c1c" : "#94a3b8"}">${r[i] === 1 ? "✓" : r[i] === 0 ? "✗" : "·"}</span>`).join("")}</div>
    <p class="muted" style="margin:8px 0 0">Get 4 of your last 5 right on the first try to master this lesson. ${mastered(n) ? '<b class="ok">★ Mastered!</b>' : ""}</p><p class="muted" style="margin:4px 0 0">Answered: ${s.n} · first-try correct: ${s.c}</p>`;
}
function nextPractice() {
  clearCharts();
  const n = LV.n, Q = G[n](Math.random() < 0.35);
  $("pStat").innerHTML = lessonStatHTML(n);
  LV.runner = mountQuestion($("pq"), Q, { mode: "practice", lesson: n, chartHost: $("pChart"), onFinish: Object.assign(res => { recordResult(n, res.firstTry); $("pStat").innerHTML = lessonStatHTML(n); }, { next: nextPractice }) });
}

/* ---------- unit test ---------- */
let TEST = { id: null };
function testLength() { const n = Number(PLAN.testLength); return [10, 15, 19].includes(n) ? n : 15; }
function renderTestStart() {
  clearCharts(); document.documentElement.style.setProperty("--c", "#7c3aed"); document.documentElement.style.setProperty("--soft", "#7c3aed14");
  const len = testLength();
  $("test").innerHTML = `<div class="grid2"><div class="card"><h3>Unit 4 practice test</h3><p style="font-size:18px">${len} questions from across the unit, one per lesson. One try each, no hints. You see your score and the worked answers at the end.</p>
      <p class="muted">Every answer is saved for your tutor and parents to see.</p><button class="btn primary big" id="tStart">Start the test</button></div>
    <div class="card"><h3>Past tests</h3>${TESTS.length ? `<table class="simple"><tr><th>Date</th><th>Score</th><th>Time</th></tr>${TESTS.slice().reverse().slice(0, 10).map(t => `<tr><td>${new Date(t.d).toLocaleDateString()}</td><td><b>${t.score} / ${t.n}</b> (${Math.round(t.score / t.n * 100)}%)</td><td>${Math.round(t.secs / 60)} min</td></tr>`).join("")}</table>` : '<p class="muted">No tests yet.</p>'}</div></div>`;
  $("tStart").onclick = startTest;
}
function startTest() {
  const len = testLength();
  let lessons = shuffle(Object.keys(L).map(Number)).slice(0, len).sort((a, b) => a - b);
  TEST = { id: "test-" + Date.now().toString(36), lessons, i: 0, results: [], t0: Date.now() };
  showTestQ();
}
function showTestQ() {
  clearCharts();
  const T = TEST, n = T.lessons[T.i], Q = G[n](Math.random() < 0.35);
  $("test").innerHTML = `<div class="testbar"><b>Question ${T.i + 1} of ${T.lessons.length}</b><div class="bar"><div style="width:${T.i / T.lessons.length * 100}%;background:#7c3aed"></div></div><span class="muted" id="tClock"></span></div>
    <div class="grid2"><div class="card"><div id="tq"></div><div class="row" style="margin-top:12px"><span style="flex:1"></span><button class="btn primary" id="tNext" disabled>Next ›</button></div></div><div class="stack"><div class="card" id="tChart" hidden></div></div></div>`;
  const tick = () => { if ($("tClock")) { const s = Math.round((Date.now() - T.t0) / 1000); $("tClock").textContent = `⏱ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; } };
  tick(); clearInterval(T.timer); T.timer = setInterval(tick, 1000);
  mountQuestion($("tq"), Q, { mode: "test", lesson: n, chartHost: $("tChart"), onFinish: Object.assign(res => {
    T.results.push(res); $("tNext").disabled = false; $("tNext").textContent = T.i + 1 < T.lessons.length ? "Next ›" : "See my results";
    $("tNext").onclick = () => { T.i++; T.i < T.lessons.length ? showTestQ() : finishTest(); }; $("tNext").focus();
  }, { next: () => $("tNext") && !$("tNext").disabled && $("tNext").click() }) });
}
function finishTest() {
  clearInterval(TEST.timer); clearCharts();
  const R = TEST.results, score = R.filter(r => r.ok).length, n = R.length, secs = Math.round((Date.now() - TEST.t0) / 1000), p = Math.round(score / n * 100);
  TESTS.push({ d: Date.now(), score, n, secs }); save("df-tests", TESTS);
  if (AM) { if (p >= 80) AM.award("test-80", "Unit 4 practice test: 80% or better", "📝"); if (p === 100) AM.award("test-100", "Perfect Unit 4 practice test", "🏆"); }
  const bySec = SECTIONS.map(S => { const rs = R.filter(r => S.lessons.includes(r.lesson)); return { S, n: rs.length, c: rs.filter(r => r.ok).length }; }).filter(x => x.n);
  $("test").innerHTML = `<div class="grid2"><div class="card"><h3>Your results</h3><div class="score" style="color:${p >= 80 ? "#0f9d58" : p >= 60 ? "#ca8a04" : "#d93025"}">${score} / ${n}</div><p style="font-size:18px">${p}% · ${Math.floor(secs / 60)} min ${secs % 60} s</p>
      <p>${p === 100 ? "🏆 Perfect score!" : p >= 80 ? "🌟 Great work. Review the ones you missed below." : "Keep going! Practice the lessons below, then try again."}</p><div class="row"><button class="btn primary" id="tAgain">Take another test</button><button class="btn" id="tHome">Unit map</button></div></div>
    <div class="card"><h3>By section</h3><table class="simple">${bySec.map(x => `<tr><td>${x.S.icon} ${x.S.name}</td><td><b>${x.c} / ${x.n}</b></td><td style="width:40%"><div class="bar"><div style="width:${x.c / x.n * 100}%;background:${x.S.color}"></div></div></td></tr>`).join("")}</table></div></div>
    <div class="card" style="margin-top:16px"><h3>Review your answers</h3>${R.map((r, i) => `<details class="rev"${r.ok ? "" : " open"}><summary>${r.ok ? '<b class="ok">✓</b>' : '<b class="bad">✗</b>'} ${i + 1}. Lesson ${r.lesson}: ${L[r.lesson].title}</summary>
      <div style="margin-top:8px">${r.Q.q}</div>${r.Q.choicesMulti ? `<ul>${r.Q.choicesMulti.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}<p>Your answer: <b>${esc(r.resp)}</b><br>Correct answer: <b class="eq">${r.Q.ans}</b></p>${(r.Q.steps || []).length ? `<ol class="steps">${r.Q.steps.map(s => `<li>${s}</li>`).join("")}</ol>` : ""}
      ${r.ok ? "" : `<button class="btn small" data-l="${r.lesson}">Practice lesson ${r.lesson} ›</button>`}</details>`).join("")}</div>`;
  $("tAgain").onclick = startTest; $("tHome").onclick = () => go("home");
  document.querySelectorAll("#test [data-l]").forEach(b => b.onclick = () => openLesson(+b.dataset.l, "practice"));
}

/* ---------- progress ---------- */
function renderProgress() {
  clearCharts();
  const tot = Object.keys(L).reduce((a, k) => a + stat(+k).n, 0), cor = Object.keys(L).reduce((a, k) => a + stat(+k).c, 0);
  $("progress").innerHTML = `<div class="grid2"><div class="card"><h3>Lessons</h3><table class="simple"><tr><th>Lesson</th><th>Answered</th><th>Last 5</th><th></th></tr>
      ${SECTIONS.map(S => S.lessons.map(n => { const s = stat(n), p = pct(n); return `<tr><td><span class="tag" style="background:${S.color};color:#fff">${n}</span> ${L[n].title}</td><td>${s.n}</td><td style="min-width:90px"><div class="bar"><div style="width:${p}%;background:${S.color}"></div></div></td><td>${mastered(n) ? '<b class="ok">★ mastered</b>' : s.n ? '<span class="muted">practicing</span>' : '<span class="muted">not started</span>'}</td></tr>`; }).join("")).join("")}</table></div>
    <div class="stack"><div class="card"><h3>Totals</h3><p style="font-size:20px;margin:0"><b>${Object.keys(L).filter(k => mastered(+k)).length} / 19</b> lessons mastered</p><p style="font-size:20px;margin:6px 0"><b>${tot}</b> questions answered</p><p style="font-size:20px;margin:0"><b>${tot ? Math.round(cor / tot * 100) : 0}%</b> right on the first try</p></div>
      <div class="card"><h3>Practice tests</h3>${TESTS.length ? TESTS.slice().reverse().slice(0, 8).map(t => `<div class="row" style="margin:6px 0"><span style="width:110px">${new Date(t.d).toLocaleDateString()}</span><div class="bar" style="flex:1"><div style="width:${t.score / t.n * 100}%;background:#7c3aed"></div></div><b>${t.score}/${t.n}</b></div>`).join("") : '<p class="muted">No tests yet.</p>'}</div></div></div>`;
}

/* ---------- nav ---------- */
function go(v) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.v === v));
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === v));
  if (v !== "test" && TEST.timer) clearInterval(TEST.timer);
  if (v === "home") { clearCharts(); document.documentElement.style.setProperty("--c", "#7c3aed"); renderHome(); }
  if (v === "lesson") renderLesson();
  if (v === "test") { if (!TEST.id || TEST.i >= (TEST.lessons || []).length || !TEST.results) renderTestStart(); else showTestQ(); }
  if (v === "progress") { document.documentElement.style.setProperty("--c", "#7c3aed"); renderProgress(); }
  window.scrollTo(0, 0);
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => go(t.dataset.v));

(function boot() {
  if (AM && AM.student) { $("appTitle").textContent = `${AM.student.firstName}'s Describing Functions`; document.title = $("appTitle").textContent; }
  const focus = planLessons();
  if (focus.length || PLAN.note) {
    $("plan").innerHTML = `<b style="color:var(--accent)">📌 ${PLAN._by ? esc(PLAN._by.split(" ")[0]) + "’s" : "Your tutor’s"} plan:</b> ` + (focus.length ? `work on <b>lesson${focus.length > 1 ? "s" : ""} ${focus.join(", ")}</b>. ` : "") + (PLAN.note ? esc(PLAN.note) : "");
    $("plan").style.display = "block";
    if (focus.length && PLAN._updated && load("df-planseen", null) !== PLAN._updated) { CUR = focus[0]; save("df-planseen", PLAN._updated); }
  }
  updateHeader();
  go(PLAN.open === "test" ? "test" : "home");
})();
</script>
</body>
</html>
