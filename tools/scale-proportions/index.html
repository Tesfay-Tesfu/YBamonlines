<script>
"use strict";
/* =====================================================================

   ===================================================================== */
const AM = window.AMT || null;
const store = AM && AM.storage ? AM.storage : (() => { try { return window.localStorage; } catch (e) { return null; } })();
const load = (k, d) => { try { const v = JSON.parse(store.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const save = (k, v) => { try { store.setItem(k, JSON.stringify(v)); } catch (e) {} };
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const nz = (a, b) => { let v; do { v = rnd(a, b); } while (v === 0); return v; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const MINUS = "−";

/* =====================================================================
   Numbers
   ===================================================================== */
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; }

}
function fmt(v) {

  if (v === -Infinity) return MINUS + "∞";

  if (f) { const [n, d] = f; return (n < 0 ? MINUS : "") + (d === 1 ? Math.abs(n) : Math.abs(n) + "/" + d); }
  return (v < 0 ? MINUS : "") + (+Math.abs(v).toFixed(2));
}
const pt = (x, y) => `(${fmt(x)}, ${fmt(y)})`;
function coefBody(a, v) { // a > 0
  if (!v) return fmt(a);
  if (Math.abs(a - 1) < 1e-12) return v;
  const f = toFrac(a);
  if (f && f[1] !== 1) return `(${f[0]}/${f[1]})${v}`;
  return fmt(a) + v;
}
function poly(terms) {
  let s = "";
  for (const [c, v] of terms) {
    if (Math.abs(c) < 1e-12) continue;
    const body = coefBody(Math.abs(c), v);

  }

}
const coefPrefix = a => (Math.abs(a - 1) < 1e-12 ? "" : Math.abs(a + 1) < 1e-12 ? MINUS : (toFrac(a) && toFrac(a)[1] !== 1 ? `(${fmt(a).replace(MINUS, "-").replace("-", MINUS)})` : fmt(a)));
const shiftStr = h => (Math.abs(h) < 1e-12 ? "x" : `(x ${h > 0 ? "−" : "+"} ${fmt(Math.abs(h))})`);
const plusK = k => (Math.abs(k) < 1e-12 ? "" : k > 0 ? ` + ${fmt(k)}` : ` − ${fmt(-k)}`);
const lineEq = (m, b) => "y = " + poly([[m, "x"], [b, ""]]);
function parseNum(s) {
  if (s == null) return NaN;
  let t = String(s).trim().toLowerCase().replace(/[−–—]/g, "-").replace(/\s+/g, "").replace(/^\+/, "");
  if (/^-?(∞|inf|infinity)$/.test(t)) return t.startsWith("-") ? -Infinity : Infinity;
  if (/^\+?(∞|inf|infinity)$/.test(t)) return Infinity;

  if (m) return -(+m[1]) / +m[2];
  if (/^-?(\d+(\.\d*)?|\.\d+)$/.test(t)) return +t;
  return NaN;

const sameNum = (a, b) => (a === b) || (Number.isFinite(a) && Number.isFinite(b) && Math.abs(a - b) <= 0.011);

/* =====================================================================
   Small helpers
   ===================================================================== */
const E = s => `<span class="eq">${s}</span>`;
const dec = v => (+(+v).toFixed(2)).toString().replace("-", MINUS);
const money = v => (v < 0 ? MINUS : "") + "$" + Math.abs(v).toFixed(2);
const NAMES = ["Amara", "Jasmine", "Kofi", "Malik", "Nia", "Tunde", "Zara", "Imani", "Jaden", "Ayana", "Omar", "Lina", "Selam", "Dawit"];
const tableHTML = (head, rows, cls = []) => `<table class="tbl"><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr>${rows.map((r, i) => `<tr>${r.map(c => `<td class="${cls[i] || ""}">${c}</td>`).join("")}</tr>`).join("")}</table>`;
const plural = (n, one, many) => (Math.abs(n) === 1 ? one : many);
const cap = s => s[0].toUpperCase() + s.slice(1);
const near = (a, b) => Math.abs(a - b) < 1e-9;

/* =====================================================================
   Chart — fixed window graphs with independent x / y scales
   ===================================================================== */
class Chart {
  constructor(canvas, opts = {}) {

    this.ro = new ResizeObserver(() => this.render()); this.ro.observe(canvas);
  }
  set(o = {}, draw = true) {

    this.square = !!o.square; this.maxH = o.maxH || 440; this.xstep = o.xstep || null; this.ystep = o.ystep || null;

  X(x) { return this.L + (x - this.x[0]) / (this.x[1] - this.x[0]) * (this.W - this.L - this.R); }
  Y(y) { return this.T + (this.y[1] - y) / (this.y[1] - this.y[0]) * (this.H - this.T - this.B); }
  step(span, px) { const c = [0.1, 0.2, 0.25, 0.5, 1, 2, 2.5, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000]; return c.find(s => s / span * px >= 30) || 1000; }
  render() {

  }

    while (ys / (y1 - y0) * (this.H - this.T - this.B) < 18) ys *= 2;

    for (let v = Math.ceil(x0 / xs - 1e-9) * xs; v <= x1 + 1e-9; v += xs) { const X = Math.round(this.X(v)) + .5; ctx.strokeStyle = "#e8edf4"; ctx.beginPath(); ctx.moveTo(X, this.T); ctx.lineTo(X, this.H - this.B); ctx.stroke(); ctx.fillText(nf(v), X, this.H - this.B + 6); }

    for (let v = Math.ceil(y0 / ys - 1e-9) * ys; v <= y1 + 1e-9; v += ys) { const Y = Math.round(this.Y(v)) + .5; ctx.strokeStyle = "#e8edf4"; ctx.beginPath(); ctx.moveTo(this.L, Y); ctx.lineTo(this.W - this.R, Y); ctx.stroke(); ctx.fillText(nf(v), this.L - 6, Y); }

const G = {};

G[1] = hard => pick([
  () => { // missing value in a proportion
    let a, b; do { a = rnd(1, 9); b = rnd(2, 10); } while (a === b);

    return numQ(`Solve the proportion: ${E(`${a}/${b} = x/${b * m}`)}`, a * m, a * m, { hint: `What number times ${b} gives ${b * m}? Multiply ${a} by the same number.`, steps: [`${b} × <b>${m}</b> = ${b * m}`, `So x = ${a} × ${m} = <b>${a * m}</b>`, `Check with cross products: ${a} × ${b * m} = ${b} × ${a * m} = ${a * b * m} ✓`] });

    const given = b * m, ansv = a * m;

  },
  () => { // simplest form
    let a, b; do { a = rnd(1, 9); b = rnd(1, 9); } while (a === b || gcd(a, b) !== 1);
    const m = rnd(2, hard ? 12 : 8);
    return { q: `Write the ratio ${E(`${a * m} : ${b * m}`)} in simplest form.`, input: "ratio", check: v => checkRatio(v, a, b), ans: `${a} : ${b}`, ansPlain: `${a}:${b}`, ph: "like 2 : 3",
      hint: `Find the greatest number that divides both ${a * m} and ${b * m}.`, steps: [`The greatest common factor of ${a * m} and ${b * m} is ${m}.`, `${a * m} ÷ ${m} = ${a} and ${b * m} ÷ ${m} = ${b}`, `Simplest form: <b>${a} : ${b}</b>`] };
  },
  () => { // which is equivalent / not equivalent
    let a, b; do { a = rnd(1, 9); b = rnd(2, 9); } while (a === b || gcd(a, b) !== 1);
    const eqv = (x, y) => x * b === y * a;
    const goods = shuffle([2, 3, 4, 5, 6, 7]).slice(0, 3).map(m => `${a * m} : ${b * m}`);
    const m = rnd(2, 5);
    const bads = [`${a + m} : ${b + m}`, `${b * m} : ${a * m}`, `${a * m} : ${b * m + 1}`, `${a * m + m} : ${b * m}`, `${a + 1} : ${b + 1}`].filter(s => { const [x, y] = s.split(" : ").map(Number); return !eqv(x, y); });
    if (hard || Math.random() < .4) return mc(`Which ratio is <b>NOT</b> equivalent to ${E(`${a} : ${b}`)}?`, bads[0], goods, { hint: "Divide both terms of each choice by the same number and compare.", steps: [`${goods.join(", ")} all simplify to ${a} : ${b}.`, `<b>${bads[0]}</b> does not simplify to ${a} : ${b}, so it is not equivalent.`] });
    return mc(`Which ratio is equivalent to ${E(`${a} : ${b}`)}?`, goods[0], bads, { hint: "Multiply both terms by the same number. Adding does not work.", steps: [`${goods[0]} = ${a} × ${+goods[0].split(" : ")[0] / a} : ${b} × ${+goods[0].split(" : ")[0] / a}`, `So <b>${goods[0]}</b> is equivalent to ${a} : ${b}.`] });

G[2] = hard => pick([

    const k = hard ? pick([1.5, 2.5, 0.5, 0.75, 2 / 3, 5 / 2, 4 / 3, 1.25]) : pick([2, 3, 4, 5, 6, 7, 8, 1.5, 2.5]);

const plainText = h => { const d = document.createElement("div"); d.innerHTML = String(h).replace(/<\/t[dh]>\s*<\/tr>/gi, " ;</td></tr>").replace(/<\/t[dh]>/gi, " </td>").replace(/<br\s*\/?>|<\/li>|<\/div>/gi, " ; "); return d.textContent.replace(/\s+/g, " ").replace(/(\s*[|;]\s*)+$/, "").trim(); };
const KEYS = { point: ["(", ")", ",", "−"], number: ["/", ".", "−"], ratio: [" : "], eq: ["y = ", "x", "/", "(", ")", "."] };
function mountQuestion(root, Q, { mode, lesson, onFinish, chartHost, label }) {
  let tries = 0, done = false, usedHelp = false; const t0 = performance.now(); const maxTries = mode === "test" || (Q.input === "choice" && Q.choices.length <= 2) ? 1 : 2;
  const sec = secOf(lesson);
  root.innerHTML = `<div class="muted">${sec.icon} Lesson ${lesson} · ${L[lesson].title}${Q.bankId ? ` <span class="tag" style="background:#eef2ff;color:#3730a3">📚 Quiz question ${Q.bankId}</span>` : mode === "practice" ? ' <span class="tag" style="background:#ecfdf5;color:#047857">♾️ New question</span>' : ""}</div><div class="q">${Q.q}</div><div class="qa"></div><div class="fb" aria-live="polite"></div><div class="work"></div>`;
  const qa = root.querySelector(".qa"), fb = root.querySelector(".fb"), work = root.querySelector(".work");
  let chart = null;
  if (chartHost) {
    chartHost.innerHTML = Q.chart ? `<canvas class="chart"></canvas>` : "";
    chartHost.hidden = !Q.chart;
    if (Q.chart) { chart = newChart(chartHost.querySelector("canvas"), Q.chart); chart.layers = c => { if (done && Q.reveal) Q.reveal(c); else if (Q.draw) Q.draw(c); }; chart.render(); }
  }
  if (Q.input === "choice") {
    qa.innerHTML = `<div class="ansrow" style="flex-direction:column;align-items:stretch">${Q.choices.map(c => `<button class="btn choice" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
    qa.querySelectorAll(".choice").forEach(b => b.onclick = () => submit(b.dataset.v, b));
  } else {
    const keys = KEYS[Q.input] || [];
    qa.innerHTML = `<div class="ansrow"><input type="text" placeholder="${esc(Q.ph || "Your answer")}" autocomplete="off" spellcheck="false" autocapitalize="off" inputmode="${Q.input === "number" ? "decimal" : "text"}"><button class="btn primary chk">${mode === "test" ? "Save answer" : "Check"}</button></div>
      ${keys.length ? `<div class="keys">${keys.map(k => `<button data-ins="${esc(k)}">${esc(k.trim())}</button>`).join("")}</div>` : ""}`;
    const inp = qa.querySelector("input");
    qa.querySelector(".chk").onclick = () => submit(inp.value);
    inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); if (!done) submit(inp.value); else if (onFinish.next) onFinish.next(); } };
    qa.querySelectorAll(".keys button").forEach(b => b.onclick = e => { e.preventDefault(); const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? s; inp.value = inp.value.slice(0, s) + b.dataset.ins + inp.value.slice(en); inp.focus(); const p = s + b.dataset.ins.length; inp.setSelectionRange(p, p); });
    if (window.innerWidth > 900) setTimeout(() => inp.focus({ preventScroll: true }), 40);
  }
  const record = (resp, ok, how) => {
    if (!AM) return;
    AM.attempt({ question: (Q.bankId ? `[Quiz Q${Q.bankId}] ` : "") + plainText(Q.q).slice(0, 280), response: String(resp).slice(0, 190), answer: plainText(Q.ansPlain || Q.ans).slice(0, 190), correct: ok, ms: performance.now() - t0,
      topic: `L${lesson} · ${L[lesson].title}`, mode: how, session: mode === "test" ? TEST.id : undefined, meta: { lesson, section: sec.id, kind: Q.input, bank: Q.bankId || null, test: mode === "test" ? TEST.id : null, testKind: mode === "test" ? TEST.kind : null } });
  };
  const showSteps = () => { const s = Q.steps || []; if (s.length) work.innerHTML = `<ol class="steps">${s.map(x => `<li>${x}</li>`).join("")}</ol>`; };
  function submit(v, btn) {
    if (done) return;
    if (!String(v).trim()) { fb.className = "fb info"; fb.textContent = "Type an answer first."; return; }
    const r = Q.check(v);
    if (r.invalid) { fb.className = "fb info"; fb.textContent = r.msg; return; }
    tries++;
    const ok = !!r.ok;
    record(v, ok, mode === "test" ? label || "unit test" : tries === 1 ? (usedHelp ? "after hint" : "first try") : "second try");
    if (mode === "test") {
      done = true; root.querySelectorAll("button.choice, input[type=text], .chk").forEach(e => (e.disabled = true));
      if (btn) btn.classList.add("picked");
      onFinish({ ok, resp: v, Q, lesson }); return;
    }
    if (btn) btn.classList.add(ok ? "right" : "wrong");
    if (ok) { done = true; fb.className = "fb okc"; fb.innerHTML = `✓ ${pick(["Correct!", "Nice work!", "You got it!", "Exactly right!", "Great thinking!"])} ${r.msg ? `<span style="font-weight:600">${r.msg}</span>` : ""}`; }
    else if (tries < maxTries) { usedHelp = true; if (btn) btn.disabled = true; fb.className = "fb badc"; fb.innerHTML = `Not quite. ${r.msg || ""} Try once more. <div class="muted" style="font-weight:600">💡 ${Q.hint}</div>`; return; }
    else {
      done = true; fb.className = "fb badc"; fb.innerHTML = `${r.msg ? r.msg + " " : ""}The answer is <span class="eq">${esc(plainText(Q.ans))}</span>.`;
      if (Q.input === "choice") qa.querySelectorAll(".choice").forEach(b => { if (b.dataset.v === Q.correct) b.classList.add("right"); });
    }
    showSteps(); if (chart) chart.render();
    onFinish({ ok, firstTry: ok && tries === 1 && !usedHelp, Q, lesson });
  }
  return {
    hint() { if (done) return; usedHelp = true; fb.className = "fb info"; fb.innerHTML = `💡 ${Q.hint}`; },
    reveal() { if (done) { showSteps(); return; } record("(showed the steps)", false, "showed answer"); done = true; fb.className = "fb info"; fb.innerHTML = `The answer is <span class="eq">${esc(plainText(Q.ans))}</span>.`;
      if (Q.input === "choice") qa.querySelectorAll(".choice").forEach(b => { if (b.dataset.v === Q.correct) b.classList.add("right"); });
      showSteps(); if (chart) chart.render(); onFinish({ ok: false, firstTry: false, Q, lesson }); },
    get done() { return done; },
  };
}

        <span class="mini"><div style="width:${p}%;background:${S.color}"></div></span><span class="st" style="color:${m ? "#0f9d58" : "#94a3b8"}">${m ? "★" : st.n ? p + "%" : ""}</span></button>`; }).join("")}</div>`).join("")}</div>`;
  document.querySelectorAll(".les").forEach(b => b.onclick = () => openLesson(+b.dataset.n, "learn"));
  $("hContinue").onclick = () => openLesson(CUR, "learn"); $("hTest").onclick = () => go("test");
}
let LV = { n: 1, tab: "learn", runner: null, force: null };
function openLesson(n, tab = "learn", force = null) { LV = { n, tab, runner: null, force }; CUR = n; save("sp-cur", n); go("lesson"); }
function renderLesson() {
  clearCharts();
  const n = LV.n, S = secOf(n), D = L[n];
  setTheme(S.color);
  $("lesson").innerHTML = `<div class="lhead" style="background:linear-gradient(120deg, ${S.color}, ${S.color}cc)"><div class="n">${n}</div><div><div class="s">${S.icon} ${S.name}</div><h2>${D.title}</h2></div><div class="grow"></div>
      ${n > 1 ? `<button class="btn small" id="lPrev">‹ Lesson ${n - 1}</button>` : ""}${n < NL ? `<button class="btn small" id="lNext">Lesson ${n + 1} ›</button>` : ""}</div>
    <div class="seg" id="lTabs"><button data-t="learn">📖 Learn</button><button data-t="explore">🔍 Explore</button><button data-t="practice">✏️ Practice</button></div><div id="lBody"></div>`;
  if ($("lPrev")) $("lPrev").onclick = () => openLesson(n - 1, LV.tab);
  if ($("lNext")) $("lNext").onclick = () => openLesson(n + 1, LV.tab);
  document.querySelectorAll("#lTabs button").forEach(b => { b.classList.toggle("on", b.dataset.t === LV.tab); b.onclick = () => { LV.tab = b.dataset.t; renderLesson(); }; });
  const body = $("lBody");
  if (LV.tab === "learn") {
    body.innerHTML = `<div class="grid2"><div class="card"><h3>Key ideas</h3><ul class="keylist">${D.key.map(k => `<li>${k}</li>`).join("")}</ul></div>
      <div class="stack"><div class="card"><h3>Example</h3><div class="example">${D.example}</div></div><div class="card"><h3>Words to know</h3><div class="vocab">${D.vocab.map(([a, b]) => `<div><b>${a}</b><br><span class="muted">${b}</span></div>`).join("")}</div></div>
      <div class="row"><button class="btn primary big" id="lGoEx">🔍 Explore it</button><button class="btn big" id="lGoPr">✏️ Practice</button></div></div></div>`;
    $("lGoEx").onclick = () => { LV.tab = "explore"; renderLesson(); }; $("lGoPr").onclick = () => { LV.tab = "practice"; renderLesson(); };
  } else if (LV.tab === "explore") { EX[n](body); }
  else {
    body.innerHTML = `<div class="grid2"><div class="card"><div id="pq"></div><div class="row" style="margin-top:12px"><button class="btn" id="pHint">💡 Hint</button><button class="btn" id="pSteps">👣 Show steps</button><span style="flex:1"></span><button class="btn primary" id="pNext">Next question ›</button></div></div>
      <div class="stack"><div class="card" id="pChart" hidden></div><div class="card"><h3>This lesson</h3><div id="pStat"></div></div></div></div>`;
    $("pHint").onclick = () => LV.runner && LV.runner.hint(); $("pSteps").onclick = () => LV.runner && LV.runner.reveal(); $("pNext").onclick = nextPractice;
    nextPractice();
  }
}
function lessonStatHTML(n) {
  const s = stat(n), r = s.recent.slice(-5), bk = BANK.filter(b => b.l === n);
  return `<div class="row">${[0, 1, 2, 3, 4].map(i => `<span style="width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-weight:900;background:${r[i] === 1 ? "#dcfce7" : r[i] === 0 ? "#fee2e2" : "#f1f5f9"};color:${r[i] === 1 ? "#15803d" : r[i] === 0 ? "#b91c1c" : "#94a3b8"}">${r[i] === 1 ? "✓" : r[i] === 0 ? "✗" : "·"}</span>`).join("")}</div>
    <p class="muted" style="margin:8px 0 0">Get 4 of your last 5 right on the first try to master this lesson. ${mastered(n) ? '<b class="ok">★ Mastered!</b>' : ""}</p><p class="muted" style="margin:4px 0 0">Answered: ${s.n} · first-try correct: ${s.c}</p>
    <p class="muted" style="margin:10px 0 4px"><b>📚 Quiz questions for this lesson</b> (you get these first, then new ones):</p>${bankGrid(bk)}`;
}
function bankGrid(list) {
  return `<div class="bgrid">${list.map(b => { const s = BST[b.id]; return `<button class="bq ${s ? (s.last ? "y" : "n") : ""}" data-b="${b.id}" title="Quiz question ${b.id}">${b.id}</button>`; }).join("")}</div>`;
}
function wireBankGrid(root) { root.querySelectorAll(".bq").forEach(b => b.onclick = () => { const q = BANK.find(x => x.id === +b.dataset.b); openLesson(q.l, "practice", q.id); }); }
function nextPractice() {
  clearCharts();
  const n = LV.n;
  let Q;
  if (LV.force) { Q = bankQ(BANK.find(b => b.id === LV.force)); LV.force = null; }
  else {
    const bk = BANK.filter(b => b.l === n), unseen = bk.filter(b => !BST[b.id]), missed = bk.filter(b => BST[b.id] && !BST[b.id].last);
    Q = unseen.length ? bankQ(unseen[0]) : missed.length && Math.random() < .35 ? bankQ(pick(missed)) : G[n](Math.random() < 0.35);
  }
  $("pStat").innerHTML = lessonStatHTML(n); wireBankGrid($("pStat"));
  LV.runner = mountQuestion($("pq"), Q, { mode: "practice", lesson: n, chartHost: $("pChart"), onFinish: Object.assign(res => { recordBank(Q, res.ok); recordResult(n, res.firstTry); $("pStat").innerHTML = lessonStatHTML(n); wireBankGrid($("pStat")); }, { next: nextPractice }) });
}

/* ---------- tests ---------- */
let TEST = { id: null };
function testLength() { const n = Number(PLAN.testLength); return [7, 14, 21].includes(n) ? n : 14; }
function renderTestStart() {
  clearCharts(); setTheme("#0d9488");
  const len = testLength();
  $("test").innerHTML = `<div class="grid2"><div class="stack"><div class="card"><h3>Mixed practice test</h3><p style="font-size:18px">${len} questions from all 7 lessons: a mix of quiz questions and new ones. One try each, no hints. You see your score and the worked answers at the end.</p>
      <button class="btn primary big" id="tStart">Start the practice test</button></div>
    <div class="card"><h3>The full 50-question quiz</h3><p style="font-size:18px">All 50 Math 7 quiz questions in order. Take your time: you can stop and come back to a lesson later.</p>
      <button class="btn big" id="tQuiz">📚 Start the 50-question quiz</button></div><p class="muted">Every answer is saved for your tutor and parents to see.</p></div>
    <div class="card"><h3>Past tests</h3>${TESTS.length ? `<table class="simple"><tr><th>Date</th><th>Test</th><th>Score</th><th>Time</th></tr>${TESTS.slice().reverse().slice(0, 12).map(t => `<tr><td>${new Date(t.d).toLocaleDateString()}</td><td>${t.kind === "quiz50" ? "50-question quiz" : "Practice test"}</td><td><b>${t.score} / ${t.n}</b> (${Math.round(t.score / t.n * 100)}%)</td><td>${Math.round(t.secs / 60)} min</td></tr>`).join("")}</table>` : '<p class="muted">No tests yet.</p>'}</div></div>`;
  $("tStart").onclick = () => startTest("mixed"); $("tQuiz").onclick = () => startTest("quiz50");
}
function startTest(kind) {
  let items;
  if (kind === "quiz50") items = BANK.slice().sort((a, b) => a.id - b.id).map(b => ({ lesson: b.l, Q: bankQ(b) }));
  else {
    const len = testLength(), order = []; while (order.length < len) order.push(...shuffle(Object.keys(L).map(Number)));
    const used = new Set();
    items = order.slice(0, len).sort((a, b) => a - b).map(n => {
      const pool = BANK.filter(b => b.l === n && !used.has(b.id) && b.id !== 46 && b.id !== 12);
      if (pool.length && Math.random() < .5) { const b = pick(pool); used.add(b.id); return { lesson: n, Q: bankQ(b) }; }
      return { lesson: n, Q: G[n](Math.random() < .4) };
    });
  }
  TEST = { id: (kind === "quiz50" ? "quiz50-" : "test-") + Date.now().toString(36), kind, items, i: 0, results: [], t0: Date.now() };
  showTestQ();
}
function showTestQ() {
  clearCharts(); setTheme("#0d9488");
  const T = TEST, { lesson: n, Q } = T.items[T.i];
  $("test").innerHTML = `<div class="testbar"><b>${T.kind === "quiz50" ? "Quiz" : "Question"} ${T.i + 1} of ${T.items.length}</b><div class="bar"><div style="width:${T.i / T.items.length * 100}%;background:#0d9488"></div></div><span class="muted" id="tClock"></span>${T.kind === "quiz50" ? '<button class="btn small" id="tStop">Finish now</button>' : ""}</div>
    <div class="grid2"><div class="card"><div id="tq"></div><div class="row" style="margin-top:12px"><span style="flex:1"></span><button class="btn primary" id="tNext" disabled>Next ›</button></div></div><div class="stack"><div class="card" id="tChart" hidden></div></div></div>`;
  const tick = () => { if ($("tClock")) { const s = Math.round((Date.now() - T.t0) / 1000); $("tClock").textContent = `⏱ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; } };
  tick(); clearInterval(T.timer); T.timer = setInterval(tick, 1000);
  if ($("tStop")) $("tStop").onclick = () => { if (T.results.length) finishTest(); else { clearInterval(T.timer); TEST = { id: null }; renderTestStart(); } };
  mountQuestion($("tq"), Q, { mode: "test", lesson: n, label: T.kind === "quiz50" ? "50-question quiz" : "unit test", chartHost: $("tChart"), onFinish: Object.assign(res => {
    recordBank(Q, res.ok); T.results.push(res); $("tNext").disabled = false; $("tNext").textContent = T.i + 1 < T.items.length ? "Next ›" : "See my results";
    $("tNext").onclick = () => { T.i++; T.i < T.items.length ? showTestQ() : finishTest(); }; $("tNext").focus();
  }, { next: () => $("tNext") && !$("tNext").disabled && $("tNext").click() }) });
}
function finishTest() {
  clearInterval(TEST.timer); clearCharts();
  const R = TEST.results, score = R.filter(r => r.ok).length, n = R.length, secs = Math.round((Date.now() - TEST.t0) / 1000), p = Math.round(score / n * 100), kind = TEST.kind;
  TESTS.push({ d: Date.now(), score, n, secs, kind }); save("sp-tests", TESTS); TEST.i = TEST.items.length; updateHeader();
  if (AM) {
    if (kind === "quiz50" && n === 50) { if (p >= 90) AM.award("quiz50-90", "50-question proportions quiz: 90% or better", "📚"); if (p === 100) AM.award("quiz50-100", "Perfect 50-question proportions quiz", "🏆"); }
    else if (kind !== "quiz50") { if (p >= 80) AM.award("test-80", "Proportions practice test: 80% or better", "📝"); if (p === 100) AM.award("test-100", "Perfect proportions practice test", "🏆"); }
    AM.flush && AM.flush();
  }
  const byL = Object.keys(L).map(Number).map(l => { const rs = R.filter(r => r.lesson === l); return { l, n: rs.length, c: rs.filter(r => r.ok).length }; }).filter(x => x.n);
  $("test").innerHTML = `<div class="grid2"><div class="card"><h3>${kind === "quiz50" ? "50-question quiz results" : "Your results"}</h3><div class="score" style="color:${p >= 80 ? "#0f9d58" : p >= 60 ? "#ca8a04" : "#d93025"}">${score} / ${n}</div><p style="font-size:18px">${p}% · ${Math.floor(secs / 60)} min ${secs % 60} s</p>
      <p>${p === 100 ? "🏆 Perfect score!" : p >= 80 ? "🌟 Great work. Review the ones you missed below." : "Keep going! Practice the lessons below, then try again."}</p><div class="row"><button class="btn primary" id="tAgain">Back to tests</button><button class="btn" id="tHome">Unit map</button></div></div>
    <div class="card"><h3>By lesson</h3><table class="simple">${byL.map(x => `<tr><td>${secOf(x.l).icon} ${x.l}. ${L[x.l].title}</td><td style="white-space:nowrap"><b>${x.c} / ${x.n}</b></td><td style="width:35%"><div class="bar"><div style="width:${x.c / x.n * 100}%;background:${secOf(x.l).color}"></div></div></td></tr>`).join("")}</table></div></div>
    <div class="card" style="margin-top:16px"><h3>Review your answers</h3>${R.map((r, i) => `<details class="rev"${r.ok ? "" : " open"}><summary>${r.ok ? '<b class="ok">✓</b>' : '<b class="bad">✗</b>'} ${i + 1}. ${r.Q.bankId ? `Quiz question ${r.Q.bankId}` : `Lesson ${r.lesson}: ${L[r.lesson].title}`}</summary>
      <div style="margin-top:8px">${r.Q.q}</div><p>Your answer: <b>${esc(r.resp)}</b><br>Correct answer: <b class="eq">${esc(plainText(r.Q.ans))}</b></p>${(r.Q.steps || []).length ? `<ol class="steps">${r.Q.steps.map(s => `<li>${s}</li>`).join("")}</ol>` : ""}
      ${r.ok ? "" : `<button class="btn small" data-l="${r.lesson}">Practice lesson ${r.lesson} ›</button>`}</details>`).join("")}</div>`;
  $("tAgain").onclick = () => { TEST = { id: null }; renderTestStart(); }; $("tHome").onclick = () => go("home");
  document.querySelectorAll("#test [data-l]").forEach(b => b.onclick = () => openLesson(+b.dataset.l, "practice"));
}

/* ---------- progress ---------- */
function renderProgress() {
  clearCharts(); setTheme("#0d9488");
  const tot = Object.keys(L).reduce((a, k) => a + stat(+k).n, 0), cor = Object.keys(L).reduce((a, k) => a + stat(+k).c, 0);
  $("progress").innerHTML = `<div class="grid2"><div class="stack"><div class="card"><h3>Lessons</h3><table class="simple"><tr><th>Lesson</th><th>Answered</th><th>Last 5</th><th></th></tr>
      ${SECTIONS.map(S => S.lessons.map(n => { const s = stat(n), p = pct(n); return `<tr><td><span class="tag" style="background:${S.color};color:#fff">${n}</span> ${L[n].title}</td><td>${s.n}</td><td style="min-width:90px"><div class="bar"><div style="width:${p}%;background:${S.color}"></div></div></td><td>${mastered(n) ? '<b class="ok">★ mastered</b>' : s.n ? '<span class="muted">practicing</span>' : '<span class="muted">not started</span>'}</td></tr>`; }).join("")).join("")}</table></div>
      <div class="card"><h3>📚 The 50 quiz questions</h3><p class="muted" style="margin-top:0">Green = right last time · red = wrong last time · grey = not tried. Tap a number to practice it.</p>${SECTIONS.map(S => S.lessons.map(n => `<div style="margin:8px 0 2px;font-weight:800;color:${S.color}">${n}. ${L[n].title}</div>${bankGrid(BANK.filter(b => b.l === n))}`).join("")).join("")}</div></div>
    <div class="stack"><div class="card"><h3>Totals</h3><p style="font-size:20px;margin:0"><b>${nMastered()} / ${NL}</b> lessons mastered</p><p style="font-size:20px;margin:6px 0"><b>${bankRight()} / 50</b> quiz questions right</p><p style="font-size:20px;margin:6px 0"><b>${tot}</b> practice questions answered</p><p style="font-size:20px;margin:0"><b>${tot ? Math.round(cor / tot * 100) : 0}%</b> right on the first try</p></div>
      <div class="card"><h3>Tests</h3>${TESTS.length ? TESTS.slice().reverse().slice(0, 10).map(t => `<div class="row" style="margin:6px 0"><span style="width:110px">${new Date(t.d).toLocaleDateString()}</span><span style="width:24px">${t.kind === "quiz50" ? "📚" : "📝"}</span><div class="bar" style="flex:1"><div style="width:${t.score / t.n * 100}%;background:#0d9488"></div></div><b>${t.score}/${t.n}</b></div>`).join("") : '<p class="muted">No tests yet.</p>'}</div></div></div>`;
  wireBankGrid($("progress"));
}

/* ---------- nav ---------- */
function go(v) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.v === v));
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === v));
  if (v !== "test" && TEST.timer) clearInterval(TEST.timer);
  if (v === "home") { clearCharts(); setTheme("#0d9488"); renderHome(); }
  if (v === "lesson") renderLesson();
  if (v === "test") { if (!TEST.id || TEST.i >= (TEST.items || []).length) renderTestStart(); else showTestQ(); }
  if (v === "progress") renderProgress();
  window.scrollTo(0, 0);
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => go(t.dataset.v));

(function boot() {
  if (AM && AM.student) { $("appTitle").textContent = `${AM.student.firstName}'s Proportions Lab`; document.title = $("appTitle").textContent; }
  const focus = planLessons();
  if (focus.length || PLAN.note) {
    $("plan").innerHTML = `<b style="color:var(--accent)">📌 ${PLAN._by ? esc(PLAN._by.split(" ")[0]) + "’s" : "Your tutor’s"} plan:</b> ` + (focus.length ? `work on <b>lesson${focus.length > 1 ? "s" : ""} ${focus.join(", ")}</b>. ` : "") + (PLAN.note ? esc(PLAN.note) : "");
    $("plan").style.display = "block";
    if (focus.length && PLAN._updated && load("sp-planseen", null) !== PLAN._updated) { CUR = focus[0]; save("sp-planseen", PLAN._updated); }
  }
  updateHeader();
  if (PLAN.open === "quiz50") { go("test"); } else go(PLAN.open === "test" ? "test" : "home");
})();
</script>
</body>
</html>
